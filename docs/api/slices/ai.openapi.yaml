openapi: 3.1.0
info:
  title: Greenhouse API Slice - ai
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/ai/slips/sessions:
    post:
      tags:
      - ai-slip-controller
      description: 사진 등록 대화를 시작합니다. 대화는 사용자에게 귀속되며 30분간 사용하지 않으면 만료됩니다.
      operationId: open
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAiSlipSession'
  /api/ai/slips/sessions/{sessionId}/requests/{requestId}/cancel:
    post:
      tags:
      - ai-slip-controller
      description: 소유한 등록 대화의 지정 요청을 중지합니다. 실행 종료를 확인한 뒤 반환하며 대화는 유지합니다.
      operationId: cancel_1
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/ai/slips/sessions/{sessionId}/extract:
    post:
      tags:
      - ai-slip-controller
      description: 선택 사진 1~10장을 동일 대화의 한 요청으로 추출합니다. metadata 순서와 photos 파일 순서는 일치해야 합니다. 사진별 최대 8MB. 결과는 사진 ID로 연결합니다.
      operationId: extract
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: X-AI-Request-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/AiSlipConversationMetadata'
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - metadata
              - photos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSlipConversationResult'
  /api/ai/slips/extract:
    post:
      tags:
      - ai-slip-controller
      description: 전표 사진을 읽고 조회 도구로 거래처·품종 후보를 찾습니다. 전표·재고를 저장하지 않습니다. JPEG/PNG 최대 8MB.
      operationId: extract_1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSlipExtractionResult'
  /api/ai/slips/sessions/{sessionId}:
    delete:
      tags:
      - ai-slip-controller
      operationId: close
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/ai/slips/sessions/{sessionId}/photos/{photoId}:
    delete:
      tags:
      - ai-slip-controller
      operationId: removePhoto
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      - name: photoId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
components:
  schemas:
    AiSlipConversationMetadata:
      type: object
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/AiSlipPhotoMetadata'
          maxItems: 10
          minItems: 0
      required:
      - photos
    AiSlipExtractionItem:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        boxes:
          type: integer
          format: int32
        calculatedAmount:
          type: integer
          format: int64
        genus:
          type: string
        itemName:
          type: string
        memo:
          type: string
        quantity:
          type: integer
          format: int32
        rawGenus:
          type: string
        rawItemName:
          type: string
        spec:
          type: string
        unit:
          type: integer
          format: int32
        unitPrice:
          type: integer
          format: int32
        varietyId:
          type: integer
          format: int64
    AiSlipFieldReview:
      type: object
      properties:
        field:
          type: string
          enum:
          - SALE_DATE
          - PARTNER
          - SALES_TYPE
          - SLIP_MEMO
          - ITEM_NAME
          - GENUS
          - GRADE
          - UNIT
          - BOXES
          - QUANTITY
          - UNIT_PRICE
          - AMOUNT
          - ITEM_MEMO
        itemIndex:
          type:
          - integer
          - 'null'
          format: int32
          description: 품목은 0부터 시작하는 행 번호, 전표 기본 정보는 null
          maximum: 99
          minimum: 0
        reason:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - field
      - reason
    AiSlipPhotoMetadata:
      type: object
      properties:
        documentForm:
          type: string
          enum:
          - CONSIGNMENT_RECEIPT
          - LISTING_REQUEST
          - UNKNOWN
        photoId:
          type: string
          minLength: 1
          pattern: '[-a-zA-Z0-9]{1,64}'
      required:
      - photoId
    AiSlipPhotoResult:
      type: object
      properties:
        errorCode:
          type: string
        photoId:
          type: string
        result:
          $ref: '#/components/schemas/SlipExtractionResult'
    AiSlipSession:
      type: object
      properties:
        sessionId:
          type: string
    ApiResponseAiSlipSession:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AiSlipSession'
        message:
          type: string
    ApiResponseSlipConversationResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SlipConversationResult'
        message:
          type: string
    ApiResponseSlipExtractionResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SlipExtractionResult'
        message:
          type: string
    ApiResponseVoid:
      type: object
      properties:
        data: {}
        message:
          type: string
    SlipConversationResult:
      type: object
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/AiSlipPhotoResult'
        requestId:
          type: string
        sessionId:
          type: string
    SlipExtractionResult:
      type: object
      properties:
        attempts:
          type: integer
          format: int32
        confidence:
          type: integer
          format: int32
          description: AI 자체 평가 신뢰도(0~100). 실제 정답률이 아닙니다.
        imageLongEdge:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiSlipExtractionItem'
        memo:
          type: string
        partnerId:
          type: integer
          format: int64
        partnerName:
          type: string
        rawPartnerName:
          type: string
        requestId:
          type: string
        reviewFields:
          type: array
          items:
            $ref: '#/components/schemas/AiSlipFieldReview'
        saleDate:
          type: string
        salesType:
          type: string
          enum:
          - DIRECT
          - AUCTION
        warnings:
          type: array
          items:
            type: string

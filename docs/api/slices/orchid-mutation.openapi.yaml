openapi: 3.1.0
info:
  title: Greenhouse API Slice - orchid-mutation
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/orchid-group-mutations:
    get:
      tags:
      - orchid-group-mutation-query-controller
      operationId: getMutations
      parameters:
      - name: orchidGroupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: mutationType
        in: query
        required: false
        schema:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
      - name: sourceDomain
        in: query
        required: false
        schema:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseOrchidGroupMutationResponse'
  /api/orchid-group-mutations/graph/{orchidGroupId}:
    get:
      tags:
      - orchid-group-mutation-query-controller
      operationId: getMutationGraph
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 2
      - name: maxNodes
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 120
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupMutationGraphResponse'
components:
  schemas:
    ApiResponseOrchidGroupMutationGraphResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrchidGroupMutationGraphResponse'
        message:
          type: string
    ApiResponsePageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseOrchidGroupMutationResponse'
        message:
          type: string
    OrchidGroupMutationEntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orchidGroupId:
          type: integer
          format: int64
        entryKind:
          type: string
          enum:
          - BASELINE
          - CREATE
          - CHANGE
          - DELETE
        role:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        stateRevisionBefore:
          type: integer
          format: int64
        stateRevisionAfter:
          type: integer
          format: int64
        beforeState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        afterState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
    OrchidGroupMutationGraphEdgeResponse:
      type: object
      properties:
        id:
          type: string
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
        edgeType:
          type: string
          enum:
          - STATE_INPUT
          - STATE_OUTPUT
          - MUTATION_RELATION
        entryRole:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        mutationRelationType:
          type: string
          enum:
          - CORRECTS
          - COMPENSATES
          - SUPERSEDES
        lineageRelationType:
          type: string
          enum:
          - CREATED_FROM_INBOUND
          - REPOTTED_TO
          - SPLIT_TO
          - MERGED_TO
          - MOVED_TO
          - POTTED_TO
          - CORRECTED_TO
    OrchidGroupMutationGraphLocationResponse:
      type: object
      properties:
        houseNumber:
          type: integer
          format: int32
        physicalBedNumber:
          type: integer
          format: int32
        side:
          type: string
          enum:
          - LEFT
          - RIGHT
          - CUSTOM
          - HANGING
        bedZoneName:
          type: string
        startPosition:
          type: number
        endPosition:
          type: number
    OrchidGroupMutationGraphNodeResponse:
      type: object
      properties:
        id:
          type: string
        nodeType:
          type: string
          enum:
          - STATE
          - MUTATION
        orchidGroupId:
          type: integer
          format: int64
        stateRevision:
          type: integer
          format: int64
        state:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        location:
          $ref: '#/components/schemas/OrchidGroupMutationGraphLocationResponse'
        mutationId:
          type: integer
          format: int64
        mutationType:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
        sourceDomain:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
        sourceType:
          type: string
        sourceReferenceId:
          type: string
        workOperation:
          $ref: '#/components/schemas/OrchidGroupMutationWorkOperationResponse'
        effectiveBusinessDate:
          type: string
          format: date
        occurredAt:
          type: string
          format: date-time
        entryKind:
          type: string
          enum:
          - BASELINE
          - CREATE
          - CHANGE
          - DELETE
        entryRole:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
    OrchidGroupMutationGraphResponse:
      type: object
      properties:
        rootOrchidGroupId:
          type: integer
          format: int64
        depth:
          type: integer
          format: int32
        maxNodes:
          type: integer
          format: int32
        truncated:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationGraphNodeResponse'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationGraphEdgeResponse'
    OrchidGroupMutationRelationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mutationId:
          type: integer
          format: int64
        relatedMutationId:
          type: integer
          format: int64
        relationType:
          type: string
          enum:
          - CORRECTS
          - COMPENSATES
          - SUPERSEDES
    OrchidGroupMutationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mutationType:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
        sourceDomain:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
        sourceType:
          type: string
        sourceReferenceId:
          type: string
        sourceOperationKey:
          type: string
        correlationId:
          type: string
          format: uuid
        commandFingerprint:
          type: string
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        effectiveBusinessDate:
          type: string
          format: date
        reason:
          type: string
        schemaVersion:
          type: integer
          format: int32
        workOperation:
          $ref: '#/components/schemas/OrchidGroupMutationWorkOperationResponse'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationEntryResponse'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationRelationResponse'
    OrchidGroupMutationStateResponse:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        status:
          type: string
        bedZoneId:
          type: integer
          format: int64
        sortOrder:
          type: integer
          format: int32
        startPosition:
          type: number
        endPosition:
          type: number
        varietyId:
          type: integer
          format: int64
        genus:
          type: string
        varietyName:
          type: string
        ageYear:
          type: integer
          format: int32
        potSizeCode:
          type: string
        placementType:
          type: string
        trayCount:
          type: integer
          format: int32
        splitPlacementAllowed:
          type: boolean
        inboundRecordId:
          type: integer
          format: int64
        memo:
          type: string
    OrchidGroupMutationWorkOperationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workTypeCode:
          type: string
        workType:
          type: string
        title:
          type: string
    PageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

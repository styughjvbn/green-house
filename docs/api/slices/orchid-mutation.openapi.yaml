openapi: 3.1.0
info:
  title: Greenhouse API Slice - orchid-mutation
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/orchid-group-mutations:
    get:
      tags:
      - orchid-group-mutation-query-controller
      operationId: getMutations
      parameters:
      - name: orchidGroupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: mutationType
        in: query
        required: false
        schema:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
      - name: sourceDomain
        in: query
        required: false
        schema:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseOrchidGroupMutationResponse'
  /api/orchid-group-mutations/graph/{orchidGroupId}:
    get:
      tags:
      - orchid-group-mutation-query-controller
      description: 노드·깊이 한도 안에서 탐색하며 표시되는 Mutation 간 관계는 최대 maxNodes × 4건이다. 노드·탐색·관계가 생략되면 truncated=true이며 전체 이력으로 취급하지
        않는다.
      operationId: getMutationGraph
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: depth
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 2
      - name: maxNodes
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 120
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupMutationGraphResponse'
components:
  schemas:
    ApiResponseOrchidGroupMutationGraphResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrchidGroupMutationGraphResponse'
        message:
          type: string
    ApiResponsePageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseOrchidGroupMutationResponse'
        message:
          type: string
    OrchidGroupMutationEntryResponse:
      type: object
      properties:
        afterState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        beforeState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        entryKind:
          type: string
          enum:
          - BASELINE
          - CREATE
          - CHANGE
          - DELETE
        id:
          type: integer
          format: int64
        orchidGroupId:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        stateRevisionAfter:
          type: integer
          format: int64
        stateRevisionBefore:
          type: integer
          format: int64
    OrchidGroupMutationGraphEdgeResponse:
      type: object
      properties:
        edgeType:
          type: string
          enum:
          - STATE_INPUT
          - STATE_OUTPUT
          - MUTATION_RELATION
        entryRole:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        id:
          type: string
        lineageRelationType:
          type: string
          enum:
          - CREATED_FROM_INBOUND
          - REPOTTED_TO
          - SPLIT_TO
          - MERGED_TO
          - MOVED_TO
          - POTTED_TO
          - CORRECTED_TO
        mutationRelationType:
          type: string
          enum:
          - CORRECTS
          - COMPENSATES
          - SUPERSEDES
        sourceNodeId:
          type: string
        targetNodeId:
          type: string
    OrchidGroupMutationGraphLocationResponse:
      type: object
      properties:
        bedZoneName:
          type: string
        endPosition:
          type: number
        houseNumber:
          type: integer
          format: int32
        physicalBedNumber:
          type: integer
          format: int32
        side:
          type: string
          enum:
          - LEFT
          - RIGHT
          - CUSTOM
          - HANGING
        startPosition:
          type: number
    OrchidGroupMutationGraphNodeResponse:
      type: object
      properties:
        effectiveBusinessDate:
          type: string
          format: date
        entryKind:
          type: string
          enum:
          - BASELINE
          - CREATE
          - CHANGE
          - DELETE
        entryRole:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        id:
          type: string
        location:
          $ref: '#/components/schemas/OrchidGroupMutationGraphLocationResponse'
        mutationId:
          type: integer
          format: int64
        mutationType:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
        nodeType:
          type: string
          enum:
          - STATE
          - MUTATION
        occurredAt:
          type: string
          format: date-time
        orchidGroupId:
          type: integer
          format: int64
        sourceDomain:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
        sourceReferenceId:
          type: string
        sourceType:
          type: string
        state:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        stateRevision:
          type: integer
          format: int64
        workOperation:
          $ref: '#/components/schemas/OrchidGroupMutationWorkOperationResponse'
    OrchidGroupMutationGraphResponse:
      type: object
      properties:
        depth:
          type: integer
          format: int32
        edges:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationGraphEdgeResponse'
        maxNodes:
          type: integer
          format: int32
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationGraphNodeResponse'
        rootOrchidGroupId:
          type: integer
          format: int64
        truncated:
          type: boolean
    OrchidGroupMutationRelationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mutationId:
          type: integer
          format: int64
        relatedMutationId:
          type: integer
          format: int64
        relationType:
          type: string
          enum:
          - CORRECTS
          - COMPENSATES
          - SUPERSEDES
    OrchidGroupMutationResponse:
      type: object
      properties:
        commandFingerprint:
          type: string
        correlationId:
          type: string
          format: uuid
        effectiveBusinessDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationEntryResponse'
        id:
          type: integer
          format: int64
        mutationType:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - RECONCILIATION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
        occurredAt:
          type: string
          format: date-time
        reason:
          type: string
        recordedAt:
          type: string
          format: date-time
        relations:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationRelationResponse'
        schemaVersion:
          type: integer
          format: int32
        sourceDomain:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
        sourceOperationKey:
          type: string
        sourceReferenceId:
          type: string
        sourceType:
          type: string
        workOperation:
          $ref: '#/components/schemas/OrchidGroupMutationWorkOperationResponse'
    OrchidGroupMutationStateResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        bedZoneId:
          type: integer
          format: int64
        endPosition:
          type: number
        genus:
          type: string
        inboundRecordId:
          type: integer
          format: int64
        memo:
          type: string
        placementType:
          type: string
        potSizeCode:
          type: string
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        splitPlacementAllowed:
          type: boolean
        startPosition:
          type: number
        status:
          type: string
        trayCount:
          type: integer
          format: int32
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
    OrchidGroupMutationWorkOperationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        workType:
          type: string
        workTypeCode:
          type: string
    PageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

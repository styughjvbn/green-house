openapi: 3.1.0
info:
  title: Greenhouse API Slice - orchid-mutation
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/orchid-group-mutations:
    get:
      tags:
      - orchid-group-mutation-query-controller
      operationId: getMutations
      parameters:
      - name: orchidGroupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: mutationType
        in: query
        required: false
        schema:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
      - name: sourceDomain
        in: query
        required: false
        schema:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseOrchidGroupMutationResponse'
components:
  schemas:
    ApiResponsePageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseOrchidGroupMutationResponse'
        message:
          type: string
    OrchidGroupMutationEntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orchidGroupId:
          type: integer
          format: int64
        entryKind:
          type: string
          enum:
          - BASELINE
          - CREATE
          - CHANGE
          - DELETE
        role:
          type: string
          enum:
          - SOURCE
          - RESULT
          - AFFECTED
        stateRevisionBefore:
          type: integer
          format: int64
        stateRevisionAfter:
          type: integer
          format: int64
        beforeState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
        afterState:
          $ref: '#/components/schemas/OrchidGroupMutationStateResponse'
    OrchidGroupMutationRelationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mutationId:
          type: integer
          format: int64
        relatedMutationId:
          type: integer
          format: int64
        relationType:
          type: string
          enum:
          - CORRECTS
          - COMPENSATES
          - SUPERSEDES
    OrchidGroupMutationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mutationType:
          type: string
          enum:
          - BASELINE_IMPORT
          - CREATE
          - UPDATE_DETAILS
          - MOVE
          - RESERVE
          - RELEASE_RESERVATION
          - CONSUME_RESERVATION
          - RESTORE_OUTBOUND
          - DISCARD
          - TRANSFORM
          - CORRECTION
          - COMPENSATION
          - CANCEL_CREATION
          - DELETE
        sourceDomain:
          type: string
          enum:
          - FARM
          - WORK
          - SALES
          - INBOUND
          - MIGRATION
        sourceType:
          type: string
        sourceReferenceId:
          type: string
        sourceOperationKey:
          type: string
        correlationId:
          type: string
          format: uuid
        commandFingerprint:
          type: string
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
        effectiveBusinessDate:
          type: string
          format: date
        reason:
          type: string
        schemaVersion:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationEntryResponse'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationRelationResponse'
    OrchidGroupMutationStateResponse:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        status:
          type: string
        bedZoneId:
          type: integer
          format: int64
        sortOrder:
          type: integer
          format: int32
        startPosition:
          type: number
        endPosition:
          type: number
        varietyId:
          type: integer
          format: int64
        genus:
          type: string
        varietyName:
          type: string
        ageYear:
          type: integer
          format: int32
        potSizeCode:
          type: string
        placementType:
          type: string
        trayCount:
          type: integer
          format: int32
        splitPlacementAllowed:
          type: boolean
        inboundRecordId:
          type: integer
          format: int64
        memo:
          type: string
    PageResponseOrchidGroupMutationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupMutationResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

openapi: 3.1.0
info:
  title: Greenhouse API Slice - partner
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/business-partners/{partnerId}:
    put:
      tags:
      - business-partner-controller
      operationId: update
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartnerUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusinessPartnerResponse'
  /api/business-partners/{partnerId}/settlement-settings:
    get:
      tags:
      - partner-settlement-settings-controller
      operationId: get
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerSettlementSettingsResponse'
    put:
      tags:
      - partner-settlement-settings-controller
      operationId: update_1
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerSettlementSettingsRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerSettlementSettingsResponse'
  /api/business-partners:
    get:
      tags:
      - business-partner-controller
      description: 호환용 활성 거래처 목록. 이름·ID 순으로 최대 500건을 반환합니다. 관리 목록은 /page, 선택지는 /options를 사용합니다.
      operationId: getPartners
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: partnerType
        in: query
        required: false
        schema:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListBusinessPartnerResponse'
      deprecated: true
    post:
      tags:
      - business-partner-controller
      operationId: create_7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessPartnerCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusinessPartnerResponse'
  /api/business-partners/{partnerId}/option:
    get:
      tags:
      - business-partner-controller
      description: 검색·페이지 범위 밖의 선택값을 표시합니다. 기존 기록의 비활성 거래처도 반환하며 신규 업무 사용 허용을 뜻하지 않습니다.
      operationId: getOption
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBusinessPartnerOptionResponse'
  /api/business-partners/page:
    get:
      tags:
      - business-partner-controller
      operationId: getPartnerPage
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: partnerType
        in: query
        required: false
        schema:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseBusinessPartnerResponse'
  /api/business-partners/options:
    get:
      tags:
      - business-partner-controller
      description: 거래처 선택지를 이름·ID 순으로 검색합니다. 검색·활성·경매장 여부를 페이지 조회 전 적용하며, 조건 생략 시 전체를 포함합니다. page는 0 이상, size는 1~100으로 보정합니다.
      operationId: getOptions
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: auctionHouse
        in: query
        required: false
        schema:
          type: boolean
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseBusinessPartnerOptionResponse'
components:
  schemas:
    ApiResponseBusinessPartnerOptionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BusinessPartnerOptionResponse'
        message:
          type: string
    ApiResponseBusinessPartnerResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BusinessPartnerResponse'
        message:
          type: string
    ApiResponseListBusinessPartnerResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BusinessPartnerResponse'
        message:
          type: string
    ApiResponsePageResponseBusinessPartnerOptionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseBusinessPartnerOptionResponse'
        message:
          type: string
    ApiResponsePageResponseBusinessPartnerResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseBusinessPartnerResponse'
        message:
          type: string
    ApiResponsePartnerSettlementSettingsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PartnerSettlementSettingsResponse'
        message:
          type: string
    BusinessPartnerCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        ownerName:
          type: string
          maxLength: 100
          minLength: 0
        phone:
          type: string
          maxLength: 50
          minLength: 0
        address:
          type: string
          maxLength: 1000
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - name
      - partnerType
    BusinessPartnerOptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        active:
          type: boolean
    BusinessPartnerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        ownerName:
          type: string
        phone:
          type: string
        address:
          type: string
        memo:
          type: string
        active:
          type: boolean
    BusinessPartnerUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        ownerName:
          type: string
          maxLength: 100
          minLength: 0
        phone:
          type: string
          maxLength: 50
          minLength: 0
        address:
          type: string
          maxLength: 1000
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - name
      - partnerType
    PageResponseBusinessPartnerOptionResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BusinessPartnerOptionResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseBusinessPartnerResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BusinessPartnerResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PartnerSettlementSettingsRequest:
      type: object
      properties:
        settlementUnit:
          type: string
          enum:
          - SALES_SLIP
          - MONTHLY_BATCH
          - AUCTION_DATE
        paymentDelayDays:
          type: integer
          format: int32
          minimum: 0
        paymentDayMode:
          type: string
          enum:
          - CALENDAR_DAY
          - BUSINESS_DAY
        autoMatchEnabled:
          type: boolean
        autoSettleEnabled:
          type: boolean
        amountTolerance:
          type: integer
          format: int64
          minimum: 0
        depositorAliases:
          type: array
          items:
            type: string
            maxLength: 100
            minLength: 0
        allowPrepayment:
          type: boolean
        creditAutoApplyEnabled:
          type: boolean
        ruleJson:
          type: object
          additionalProperties: {}
        memo:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - amountTolerance
      - depositorAliases
      - paymentDayMode
      - paymentDelayDays
      - settlementUnit
    PartnerSettlementSettingsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        settlementUnit:
          type: string
          enum:
          - SALES_SLIP
          - MONTHLY_BATCH
          - AUCTION_DATE
        paymentDelayDays:
          type: integer
          format: int32
        paymentDayMode:
          type: string
          enum:
          - CALENDAR_DAY
          - BUSINESS_DAY
        autoMatchEnabled:
          type: boolean
        autoSettleEnabled:
          type: boolean
        amountTolerance:
          type: integer
          format: int64
        depositorAliases:
          type: array
          items:
            type: string
        allowPrepayment:
          type: boolean
        creditAutoApplyEnabled:
          type: boolean
        ruleJson:
          type: object
          additionalProperties: {}
        memo:
          type: string

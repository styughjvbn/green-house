        content:
          type: array
          items:
            $ref: '#/components/schemas/MaterialResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseVarietyResponse:
      type: object
      properties:
        content:
          type: array

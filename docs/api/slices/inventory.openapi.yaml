openapi: 3.1.0
info:
  title: Greenhouse API Slice - inventory
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/varieties:
    get:
      tags:
      - variety-controller
      operationId: getVarieties
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: genus
        in: query
        required: false
        schema:
          type: string
      - name: saleEnabled
        in: query
        required: false
        schema:
          type: boolean
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseVarietyResponse'
    post:
      tags:
      - variety-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VarietyCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVarietyResponse'
  /api/materials:
    get:
      tags:
      - material-controller
      operationId: getMaterials
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: manufacturer
        in: query
        required: false
        schema:
          type: string
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseMaterialResponse'
    post:
      tags:
      - material-controller
      operationId: create_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMaterialResponse'
  /api/inbound-records:
    get:
      tags:
      - inbound-record-controller
      operationId: getInboundRecords
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: inboundType
        in: query
        required: false
        schema:
          type: string
          enum:
          - FLASK_SEEDLING
          - POTTED_SEEDLING
          - PRODUCT_POT
          - SAMPLE
          - ETC
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - POTTING_PENDING
          - POTTING_IN_PROGRESS
          - PLACED
          - CANCELED
      - name: variety
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseInboundRecordResponse'
    post:
      tags:
      - inbound-record-controller
      operationId: create_5
      parameters:
      - name: Idempotency-Key
        in: header
        description: 생성 재전송은 같은 키와 입력을 유지합니다. 키 생략 시 별도 신규 입고를 생성합니다.
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundRecordCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInboundRecordResponse'
  /api/inbound-records/{inboundRecordId}/potting:
    post:
      tags:
      - inbound-record-controller
      operationId: potting
      parameters:
      - name: inboundRecordId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundRecordPottingRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInboundRecordResponse'
      deprecated: true
  /api/inbound-records/{inboundRecordId}/potting-void:
    post:
      tags:
      - inbound-record-controller
      operationId: voidPotting
      parameters:
      - name: inboundRecordId
        in: path

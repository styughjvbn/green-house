    ApiResponseVoid:
      type: object
      properties:
        data: {}
        message:
          type: string
    InboundNewVarietyRequest:
      type: object
      properties:
        defaultPotSize:
          type: string
          maxLength: 50
          minLength: 0
        genus:
          type: string
          maxLength: 100
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        name:
          type: string
          maxLength: 150
          minLength: 0
      required:
      - genus
      - name
    InboundOrchidGroupResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        bedZoneId:
          type: integer
          format: int64
        endPosition:
          type: number
        id:
          type: integer
          format: int64
        location:
          type: string
        placementType:
          type: string
        potSize:
          type: string
        quantity:
          type: integer
          format: int32
        startPosition:
          type: number
        status:
          type: string
        trayCount:
          type: integer
          format: int32
    InboundPlacementInput:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
          minimum: 0
        bedZoneId:
          type: integer
          format: int64
        endPosition:
          type: number
        placementType:
          type: string
          maxLength: 100
          minLength: 0
        potSize:
          type: string
          maxLength: 50
          minLength: 0
        quantity:
          type: integer
          format: int32
          minimum: 1
        startPosition:
          type: number
        trayCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - bedZoneId
      - quantity
    InboundRecordCancelRequest:
      type: object
      properties:
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
    InboundRecordCreateRequest:
      type: object
      properties:
        estimatedQuantity:
          type: integer
          format: int32
          minimum: 1
        inboundDate:
          type: string
          format: date
        inboundType:
          type: string
          enum:
          - FLASK_SEEDLING
          - POTTED_SEEDLING
          - PRODUCT_POT
          - SAMPLE
          - ETC
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        newVariety:
          $ref: '#/components/schemas/InboundNewVarietyRequest'
        placement:
          $ref: '#/components/schemas/InboundPlacementInput'
        pottingDueDate:
          type: string
          format: date
        tempLocation:
          type: string
          maxLength: 255
          minLength: 0
        varietyId:
          type: integer
          format: int64
        worker:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - inboundDate
      - inboundType
    InboundRecordPottingRequest:
      type: object
      properties:
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        pottingDate:
          type: string
          format: date
        results:
          type: array
          items:
            $ref: '#/components/schemas/RepotResultOrchidGroupRequest'
          maxItems: 100
          minItems: 0
        worker:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - pottingDate
      - results
    InboundRecordPottingVoidRequest:
      type: object
      properties:
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        reason:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - idempotencyKey
      - reason
    InboundRecordResponse:
      type: object
      properties:
        availableActions:
          type: array
          items:
            type: string
            enum:
            - CANCEL
            - VOID_POTTING
        createdAt:
          type: string
          format: date-time
        createdOrchidGroups:
          type: array
          items:
            $ref: '#/components/schemas/InboundOrchidGroupResponse'
        editable:
          type: boolean
        estimatedQuantity:
          type: integer
          format: int32
        genus:
          type: string
        id:
          type: integer
          format: int64
        inboundDate:
          type: string
          format: date
        inboundType:
          type: string
        memo:
          type: string
        pottingDate:
          type: string
          format: date
        pottingDueDate:
          type: string
          format: date
        status:
          type: string
        tempLocation:
          type: string
        updatedAt:
          type: string
          format: date-time
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
        worker:
          type: string
    InboundRecordUpdateRequest:
      type: object
      properties:
        estimatedQuantity:
          type: integer
          format: int32
          minimum: 1
        inboundDate:
          type: string
          format: date
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        pottingDueDate:
          type: string
          format: date
        tempLocation:
          type: string
          maxLength: 255
          minLength: 0
        worker:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - inboundDate
    MaterialCreateRequest:
      type: object
      properties:
        category:
          type: string
          maxLength: 50
          minLength: 0
        manufacturer:
          type: string
          maxLength: 150
          minLength: 0
        name:
          type: string
          maxLength: 150
          minLength: 0
        specification:
          type: string
          maxLength: 150
          minLength: 0
        stockQuantity:
          type: string
          maxLength: 50
          minLength: 0
        storageLocation:
          type: string
          maxLength: 150
          minLength: 0
        usage:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - category
      - name
    MaterialResponse:
      type: object
      properties:
        active:
          type: boolean
        category:
          type: string
        code:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        manufacturer:
          type: string
        name:
          type: string
        specification:
          type: string
        stockQuantity:
          type: string
        storageLocation:
          type: string
        updatedAt:
          type: string
          format: date-time
        usage:
          type: string
    MaterialUpdateRequest:
      type: object
      properties:
        category:
          type: string
          maxLength: 50
          minLength: 0
        manufacturer:
          type: string
          maxLength: 150
          minLength: 0
        name:
          type: string
          maxLength: 150
          minLength: 0
        specification:
          type: string
          maxLength: 150
          minLength: 0
        stockQuantity:
          type: string
          maxLength: 50
          minLength: 0
        storageLocation:
          type: string
          maxLength: 150
          minLength: 0
        usage:
          type: string
          maxLength: 2000
          minLength: 0

        connectedGroupCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        defaultPotSize:
          type: string
        description:
          type: string
        genus:
          type: string
        id:
          type: integer
          format: int64
        memo:
          type: string
        name:
          type: string
        recentInboundDate:
          type: string
          format: date
        recentWorkDate:
          type: string
          format: date
        saleEnabled:
          type: boolean
        saleableQuantity:
          type: integer
          format: int64
        totalQuantity:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    VarietyUpdateRequest:
      type: object
      properties:
        alias:
          type: string
          maxLength: 150
          minLength: 0
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        defaultPotSize:

openapi: 3.1.0
info:
  title: Greenhouse API Slice - analytics
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/analytics/work:
    get:
      tags:
      - analytics-controller
      operationId: getWorkAnalytics
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkAnalyticsResponse'
  /api/analytics/sales:
    get:
      tags:
      - analytics-controller
      operationId: getSalesAnalytics
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesAnalyticsResponse'
  /api/analytics/partners:
    get:
      tags:
      - analytics-controller
      operationId: getPartnerAnalytics
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerAnalyticsResponse'
components:
  schemas:
    AnalyticsInsightResponse:
      type: object
      properties:
        actionHref:
          type: string
        actionLabel:
          type: string
        text:
          type: string
        tone:
          type: string
    AnalyticsRankedValueResponse:
      type: object
      properties:
        label:
          type: string
        secondary:
          type: string
        value:
          type: integer
          format: int64
    AnalyticsSlipSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paidAmount:
          type: integer
          format: int64
        partnerName:
          type: string
        paymentStatus:
          type: string
        remainingAmount:
          type: integer
          format: int64
        saleDate:
          type: string
          format: date
        salesStatus:
          type: string
        slipNumber:
          type: string
        totalAmount:
          type: integer
          format: int32
    ApiResponsePartnerAnalyticsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PartnerAnalyticsResponse'
        message:
          type: string
    ApiResponseSalesAnalyticsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesAnalyticsResponse'
        message:
          type: string
    ApiResponseWorkAnalyticsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WorkAnalyticsResponse'
        message:
          type: string
    PartnerAnalyticsResponse:
      type: object
      properties:
        partnerSales:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'
        partnerStats:
          type: array
          items:
            $ref: '#/components/schemas/PartnerAnalyticsStatResponse'
    PartnerAnalyticsStatResponse:
      type: object
      properties:
        creditBalance:
          type: integer
          format: int64
        latestSaleDate:
          type: string
          format: date
        paidAmount:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        partnerName:
          type: string
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        receivableBalance:
          type: integer
          format: int64
        totalSales:
          type: integer
          format: int64
        transactionCount:
          type: integer
          format: int64
        unappliedPaymentAmount:
          type: integer
          format: int64
        unpaidAmount:
          type: integer
          format: int64
    SalesAnalyticsResponse:
      type: object
      properties:
        currentMonthSales:
          type: integer
          format: int64
        monthlySales:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'
        partnerSales:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'
        paymentBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'
        previousMonthSales:
          type: integer
          format: int64
        previousMonthShippedQuantity:
          type: integer
          format: int64
        recentSlips:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSlipSummaryResponse'
        saleableQuantity:
          type: integer
          format: int64
        salesInsights:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsInsightResponse'
        shippedQuantity:
          type: integer
          format: int64
        unpaidAmount:
          type: integer
          format: int64
        unpaidSlips:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSlipSummaryResponse'
        varietyInventory:
          type: array
          items:
            $ref: '#/components/schemas/VarietyInventoryAnalyticsResponse'
        varietySales:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'
    VarietyInventoryAnalyticsResponse:
      type: object
      properties:
        saleableQuantity:
          type: integer
          format: int64
        varietyName:
          type: string
        warningGroupCount:
          type: integer
          format: int64
    WorkAnalyticsItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memo:
          type: string
        sourceScopeType:
          type: string
          enum:
          - NONE
          - FARM
          - HOUSE
          - PHYSICAL_BED
          - BED_ZONE
          - ORCHID_GROUP
          - DERIVED_GROUP
          - USER_COLLECTION
          - MANUAL_SELECTION
          - INBOUND_RECORD_SELECTION
        status:
          type: string
          enum:
          - PLANNED
          - IN_PROGRESS
          - PAUSED
          - COMPLETED
          - STOPPED
          - CANCELED
          - VOIDED
        title:
          type: string
        workDate:
          type: string
          format: date
        workType:
          type: string
        workTypeTemplate:
          type: string
          enum:
          - PESTICIDE
          - FERTILIZER
          - REPOT
          - CLEANUP
          - DISCARD
          - STATUS
          - MEMO
          - MOVEMENT
          - RECONCILIATION
        worker:
          type: string
    WorkAnalyticsResponse:
      type: object
      properties:
        latestWorkDate:
          type: string
          format: date
        movementCount:
          type: integer
          format: int64
        recentRecords:
          type: array
          items:
            $ref: '#/components/schemas/WorkAnalyticsItemResponse'
        statusCount:
          type: integer
          format: int64
        totalCount:
          type: integer
          format: int64
        workTypeCounts:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsRankedValueResponse'

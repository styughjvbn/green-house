openapi: 3.1.0
info:
  title: Greenhouse API Slice - farm-structure
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/orchid-groups:
    get:
      tags:
      - orchid-group-query-controller
      operationId: getOrchidGroups
      parameters:
      - name: houseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: physicalBedId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: bedZoneId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListOrchidGroupResponse'
  /api/orchid-groups/{orchidGroupId}:
    get:
      tags:
      - orchid-group-query-controller
      operationId: getOrchidGroup
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupResponse'
  /api/physical-beds:
    get:
      tags:
      - farm-structure-controller
      operationId: getPhysicalBeds
      parameters:
      - name: houseId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPhysicalBedResponse'
  /api/physical-beds/{physicalBedId}:
    get:
      tags:
      - farm-structure-controller
      operationId: getPhysicalBed
      parameters:
      - name: physicalBedId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePhysicalBedResponse'
  /api/orchid-groups/{orchidGroupId}/lineage:
    get:
      tags:
      - orchid-group-query-controller
      operationId: getLineage
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupLineageResponse'
  /api/houses:
    get:
      tags:
      - farm-structure-controller
      operationId: getHouses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListHouseResponse'
  /api/houses/{houseId}:
    get:
      tags:
      - farm-structure-controller
      operationId: getHouse
      parameters:
      - name: houseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHouseResponse'
  /api/bed-zones:
    get:
      tags:
      - farm-structure-controller
      operationId: getBedZones
      parameters:
      - name: houseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: physicalBedId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListBedZoneResponse'
  /api/bed-zones/{bedZoneId}:
    get:
      tags:
      - farm-structure-controller
      operationId: getBedZone
      parameters:
      - name: bedZoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBedZoneResponse'
components:
  schemas:
    ApiResponseBedZoneResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BedZoneResponse'
        message:
          type: string
    ApiResponseHouseResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/HouseResponse'
        message:
          type: string
    ApiResponseListBedZoneResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BedZoneResponse'
        message:
          type: string
    ApiResponseListHouseResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HouseResponse'
        message:
          type: string
    ApiResponseListOrchidGroupResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupResponse'
        message:
          type: string
    ApiResponseListPhysicalBedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalBedResponse'
        message:
          type: string
    ApiResponseOrchidGroupLineageResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrchidGroupLineageResponse'
        message:
          type: string
    ApiResponseOrchidGroupResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrchidGroupResponse'
        message:
          type: string
    ApiResponsePhysicalBedResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PhysicalBedResponse'
        message:
          type: string
    BedZoneResponse:
      type: object
      properties:
        active:
          type: boolean
        houseId:
          type: integer
          format: int64
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        memo:
          type: string
        name:
          type: string
        orchidGroups:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupResponse'
        physicalBedId:
          type: integer
          format: int64
        physicalBedNumber:
          type: integer
          format: int32
        side:
          type: string
          enum:
          - LEFT
          - RIGHT
          - CUSTOM
          - HANGING
        sortOrder:
          type: integer
          format: int32
        zoneType:
          type: string
          enum:
          - DEFAULT
          - CUSTOM
          - HANGING
          - TRAY
          - GRID
    HouseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memo:
          type: string
        name:
          type: string
        number:
          type: integer
          format: int32
        physicalBeds:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalBedResponse'
    OrchidGroupLineageItemResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        relationType:
          type: string
          enum:
          - CREATED_FROM_INBOUND
          - REPOTTED_TO
          - SPLIT_TO
          - MERGED_TO
          - MOVED_TO
          - POTTED_TO
          - CORRECTED_TO
        resultOrchidGroup:
          $ref: '#/components/schemas/OrchidGroupResponse'
        resultQuantity:
          type: integer
          format: int32
        sourceOrchidGroup:
          $ref: '#/components/schemas/OrchidGroupResponse'
        sourceQuantity:
          type: integer
          format: int32
        workOperationId:
          type: integer
          format: int64
    OrchidGroupLineageNodeResponse:
      type: object
      properties:
        orchidGroup:
          $ref: '#/components/schemas/OrchidGroupResponse'
        quantity:
          type: integer
          format: int32
    OrchidGroupLineageResponse:
      type: object
      properties:
        orchidGroupId:
          type: integer
          format: int64
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupLineageItemResponse'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupLineageItemResponse'
        transformations:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupLineageTransformationResponse'
    OrchidGroupLineageTransformationResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        increaseQuantity:
          type: integer
          format: int32
        lossQuantity:
          type: integer
          format: int32
        relationType:
          type: string
          enum:
          - CREATED_FROM_INBOUND
          - REPOTTED_TO
          - SPLIT_TO
          - MERGED_TO
          - MOVED_TO
          - POTTED_TO
          - CORRECTED_TO
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupLineageNodeResponse'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OrchidGroupLineageNodeResponse'
        totalInputQuantity:
          type: integer
          format: int32
        totalResultQuantity:
          type: integer
          format: int32
        workOperationId:
          type: integer
          format: int64
    OrchidGroupResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        bedZoneId:
          type: integer
          format: int64
        bedZoneName:
          type: string
        endPosition:
          type: number
        genus:
          type: string
        houseId:
          type: integer
          format: int64
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        memo:
          type: string
        physicalBedNumber:
          type: integer
          format: int32
        placementType:
          type: string
        potSize:
          type: string
        potSizeCode:
          type: string
          enum:
          - UNSPECIFIED
          - UNMAPPED
          - POT_2
          - POT_2_5
          - POT_3
          - POT_3_5
          - POT_4
          - POT_4_5
          - POT_5
          - POT_6
          - HANGING
          - ETC
        quantity:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        splitPlacementAllowed:
          type: boolean
        startPosition:
          type: number
        status:
          type: string
        trayCount:
          type: integer
          format: int32
        varietyColor:
          type: string
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
    PhysicalBedResponse:
      type: object
      properties:
        bedZones:
          type: array
          items:
            $ref: '#/components/schemas/BedZoneResponse'
        displayOrder:
          type: integer
          format: int32
        houseId:
          type: integer
          format: int64
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        lengthCm:
          type: integer
          format: int32
        memo:
          type: string
        number:
          type: integer
          format: int32
        positionUnitCount:
          type: number
        positionUnitLabel:
          type: string
        supportIntervalCm:
          type: integer
          format: int32
        widthCm:
          type: integer
          format: int32
        wireCount:
          type: integer
          format: int32

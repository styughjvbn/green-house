openapi: 3.1.0
info:
  title: Greenhouse API Slice - auth
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthenticatedUserResponse'
  /api/auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthenticatedUserResponse'
  /api/auth/context:
    get:
      tags:
      - auth-controller
      operationId: context
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseApplicationContextResponse'
components:
  schemas:
    ApiResponseApplicationContextResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ApplicationContextResponse'
        message:
          type: string
    ApiResponseAuthenticatedUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUserResponse'
        message:
          type: string
    ApiResponseVoid:
      type: object
      properties:
        data: {}
        message:
          type: string
    ApplicationContextResponse:
      type: object
      properties:
        businessDate:
          type: string
          format: date
        timeZone:
          type: string
    AuthenticatedUserResponse:
      type: object
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - WORKER
          - DEMO
        username:
          type: string
    LoginRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
      required:
      - password
      - username

openapi: 3.1.0
info:
  title: Greenhouse API Slice - payment
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/business-partners/{partnerId}/payment-receipts:
    get:
      tags:
      - payment-controller
      operationId: receiptPage
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePaymentReceiptResponse'
    post:
      tags:
      - payment-controller
      description: 대상 미지정 수동 수납. 유효 배분과 전표 입금액은 변경하지 않습니다.
      operationId: receiveUnassignedPayment
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerPaymentEventResponse'
  /api/business-partners/{partnerId}/payment-receipts/{receiptId}/cancel:
    post:
      tags:
      - payment-controller
      description: 미배분 수납의 오입력 취소. 실제 환불을 기록하지 않습니다.
      operationId: cancelUnassignedPayment
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: receiptId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelUnassignedReceiptRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerPaymentEventResponse'
  /api/business-partners/{partnerId}/payment-allocations:
    post:
      tags:
      - payment-controller
      operationId: allocate
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAllocationRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentAllocationChangeResponse'
  /api/business-partners/{partnerId}/payment-allocation-corrections:
    post:
      tags:
      - payment-controller
      operationId: correctAllocations
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAllocationCorrectionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentAllocationChangeResponse'
  /api/payment-allocation-metadata:
    get:
      tags:
      - payment-controller
      operationId: getPaymentAllocationMetadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentAllocationMetadata'
  /api/partner-payment-events:
    get:
      tags:
      - payment-controller
      description: 호환용 목록. 입금일·ID 역순으로 최신 500건까지 반환합니다. 운영 화면은 /partner-payment-events/page를 사용합니다.
      operationId: getEvents
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: targetType
        in: query
        required: false
        schema:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
      - name: targetId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPartnerPaymentEventResponse'
      deprecated: true
  /api/partner-payment-events/page:
    get:
      tags:
      - payment-controller
      description: 조건에 맞는 입금 이벤트를 입금일·ID 역순으로 조회합니다. 유형 필터는 페이지 조회 전 적용됩니다. page는 0 이상, size는 1~100으로 보정합니다.
      operationId: getPaymentEventPage
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: targetType
        in: query
        required: false
        schema:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
      - name: targetId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: eventType
        in: query
        required: false
        schema:
          type: string
          enum:
          - PAYMENT_RECEIVED
          - PAYMENT_ALLOCATED
          - PREPAYMENT_RECEIVED
          - CREDIT_APPLIED
          - CREDIT_REFUND
          - AUTO_MATCH_CANDIDATE
          - AUTO_MATCH_CONFIRMED
          - MANUAL_MATCH_CONFIRMED
          - MATCH_REJECTED
          - PAYMENT_UNLINKED
          - ADJUSTMENT
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePartnerPaymentEventResponse'
  /api/business-partners/{partnerId}/payment-receipts/{receiptId}:
    get:
      tags:
      - payment-controller
      operationId: receipt
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: receiptId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentReceiptResponse'
  /api/business-partners/{partnerId}/payment-receipts/{receiptId}/allocations:
    get:
      tags:
      - payment-controller
      operationId: receiptAllocations
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: receiptId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePaymentAllocationResponse'
  /api/business-partners/{partnerId}/payment-allocation-targets:
    get:
      tags:
      - payment-controller
      operationId: allocationTargets
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: targetType
        in: query
        required: true
        schema:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePaymentAllocationTargetOption'
  /api/business-partners/{partnerId}/balance-summary:
    get:
      tags:
      - payment-controller
      operationId: getBalance
      parameters:
      - name: partnerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePartnerBalanceSummaryResponse'
components:
  schemas:
    ApiResponseListPartnerPaymentEventResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPaymentEventResponse'
        message:
          type: string
    ApiResponsePageResponsePartnerPaymentEventResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponsePartnerPaymentEventResponse'
        message:
          type: string
    ApiResponsePageResponsePaymentAllocationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponsePaymentAllocationResponse'
        message:
          type: string
    ApiResponsePageResponsePaymentAllocationTargetOption:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponsePaymentAllocationTargetOption'
        message:
          type: string
    ApiResponsePageResponsePaymentReceiptResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponsePaymentReceiptResponse'
        message:
          type: string
    ApiResponsePartnerBalanceSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PartnerBalanceSummaryResponse'
        message:
          type: string
    ApiResponsePartnerPaymentEventResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PartnerPaymentEventResponse'
        message:
          type: string
    ApiResponsePaymentAllocationChangeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentAllocationChangeResponse'
        message:
          type: string
    ApiResponsePaymentAllocationMetadata:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentAllocationMetadata'
        message:
          type: string
    ApiResponsePaymentReceiptResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentReceiptResponse'
        message:
          type: string
    CancelUnassignedReceiptRequest:
      type: object
      properties:
        correctionDate:
          type: string
          format: date
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        reason:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - correctionDate
      - idempotencyKey
      - reason
    ManualPaymentRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        depositorName:
          type: string
          maxLength: 100
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          maxLength: 30
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - amount
      - idempotencyKey
      - paymentDate
    PageResponsePartnerPaymentEventResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPaymentEventResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponsePaymentAllocationResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocationResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponsePaymentAllocationTargetOption:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocationTargetOption'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponsePaymentReceiptResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentReceiptResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PartnerBalanceSummaryResponse:
      type: object
      properties:
        creditBalance:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        partnerName:
          type: string
        receivableBalance:
          type: integer
          format: int64
        unappliedPaymentAmount:
          type: integer
          format: int64
    PartnerPaymentEventResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        createdBy:
          type: string
        depositorName:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date
        eventType:
          type: string
          enum:
          - PAYMENT_RECEIVED
          - PAYMENT_ALLOCATED
          - PREPAYMENT_RECEIVED
          - CREDIT_APPLIED
          - CREDIT_REFUND
          - AUTO_MATCH_CANDIDATE
          - AUTO_MATCH_CONFIRMED
          - MANUAL_MATCH_CONFIRMED
          - MATCH_REJECTED
          - PAYMENT_UNLINKED
          - ADJUSTMENT
        id:
          type: integer
          format: int64
        memo:
          type: string
        parentEventId:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        partnerName:
          type: string
        paymentMethod:
          type: string
        status:
          type: string
          enum:
          - UNAPPLIED
          - PARTIALLY_APPLIED
          - FULLY_APPLIED
          - CANDIDATE
          - CONFIRMED
          - REJECTED
          - CANCELLED
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
        unappliedAmount:
          type: integer
          format: int64
        unassignedCancellationAllowed:
          type: boolean
    PaymentAllocationChangeResponse:
      type: object
      properties:
        allocationIds:
          type: array
          items:
            type: integer
            format: int64
        cancellationIds:
          type: array
          items:
            type: integer
            format: int64
    PaymentAllocationCorrectionRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocationLine'
          maxItems: 100
          minItems: 0
        cancellationIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 100
          minItems: 0
        correctionDate:
          type: string
          format: date
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        reason:
          type: string
          maxLength: 1000
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - allocations
      - cancellationIds
      - correctionDate
      - idempotencyKey
      - reason
    PaymentAllocationLine:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        receiptId:
          type: integer
          format: int64
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
      required:
      - amount
      - receiptId
      - targetId
      - targetType
    PaymentAllocationMetadata:
      type: object
      properties:
        targetTypes:
          type: array
          items:
            type: string
            enum:
            - SALES_SLIP
            - AUCTION_SETTLEMENT
            - AUCTION_PROCEEDS
            - NONE
    PaymentAllocationRequest:
      type: object
      properties:
        allocationDate:
          type: string
          format: date
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocationLine'
          maxItems: 100
          minItems: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - allocationDate
      - allocations
      - idempotencyKey
    PaymentAllocationResponse:
      type: object
      properties:
        allocationDate:
          type: string
          format: date
        amount:
          type: integer
          format: int64
        cancellationAllowed:
          type: boolean
        id:
          type: integer
          format: int64
        receiptId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - UNAPPLIED
          - PARTIALLY_APPLIED
          - FULLY_APPLIED
          - CANDIDATE
          - CONFIRMED
          - REJECTED
          - CANCELLED
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
    PaymentAllocationTargetOption:
      type: object
      properties:
        allocationAllowed:
          type: boolean
        availableAmount:
          type:
          - number
          - 'null'
        correctionAllowed:
          type: boolean
        id:
          type: integer
          format: int64
        paidAmount:
          type:
          - number
          - 'null'
        receivableAmount:
          type:
          - integer
          - 'null'
          format: int64
        reviewRequired:
          type: boolean
        sourceReference:
          type:
          - string
          - 'null'
        targetType:
          type: string
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
    PaymentReceiptResponse:
      type: object
      properties:
        allocationAllowed:
          type: boolean
        amount:
          type: integer
          format: int64
        availableAmount:
          type: integer
          format: int64
        correctionAllowed:
          type: boolean
        depositorName:
          type:
          - string
          - 'null'
        id:
          type: integer
          format: int64
        memo:
          type:
          - string
          - 'null'
        originalTargetId:
          type:
          - integer
          - 'null'
          format: int64
        originalTargetType:
          type:
          - string
          - 'null'
          enum:
          - SALES_SLIP
          - AUCTION_SETTLEMENT
          - AUCTION_PROCEEDS
          - NONE
        partnerId:
          type: integer
          format: int64
        paymentDate:
          type: string
          format: date
        reviewRequired:
          type: boolean
        status:
          type: string
          enum:
          - UNAPPLIED
          - PARTIALLY_APPLIED
          - FULLY_APPLIED
          - CANDIDATE
          - CONFIRMED
          - REJECTED
          - CANCELLED

openapi: 3.1.0
info:
  title: Greenhouse API Slice - orchid-command
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/bed-zones/{bedZoneId}/placement-profile:
    get:
      tags:
      - bed-placement-controller
      operationId: get_1
      parameters:
      - name: bedZoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBedZonePlacementProfileResponse'
    put:
      tags:
      - bed-placement-controller
      operationId: update_2
      parameters:
      - name: bedZoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedZonePlacementProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBedZonePlacementProfileResponse'
  /api/work-operations/repot:
    post:
      tags:
      - repot-work-operation-controller
      operationId: execute
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepotWorkOperationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRepotWorkOperationResponse'
  /api/orchid-groups:
    post:
      tags:
      - orchid-group-command-controller
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchidGroupCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupResponse'
  /api/orchid-groups/{orchidGroupId}/stock-counts:
    get:
      tags:
      - orchid-group-command-controller
      operationId: stockCountHistory
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageOrchidStockCountResponse'
    post:
      tags:
      - orchid-group-command-controller
      operationId: stockCount
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchidStockCountRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidStockCountResponse'
  /api/orchid-groups/{orchidGroupId}/reconciliations:
    post:
      tags:
      - orchid-group-command-controller
      operationId: reconcile
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchidGroupReconciliationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkOperationResponse'
  /api/orchid-groups/{orchidGroupId}:
    delete:
      tags:
      - orchid-group-command-controller
      operationId: delete_1
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    patch:
      tags:
      - orchid-group-command-controller
      operationId: update_4
      parameters:
      - name: orchidGroupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchidGroupUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrchidGroupResponse'
  /api/orchid-groups/batch:
    patch:
      tags:
      - orchid-group-command-controller
      operationId: updateBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchidGroupBatchUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListOrchidGroupResponse'
  /api/work-operations/{workOperationId}/repot-results:
    get:
      tags:
      - repot-work-operation-controller
      operationId: get_4
      parameters:
      - name: workOperationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRepotWorkOperationResponse'
  /api/orchid-groups/{orchidGroupId}/stock-count-context:
    get:
      tags:
      - orchid-group-command-controller
      operationId: stockCountContext
      parameters:
      - name: orchidGroupId

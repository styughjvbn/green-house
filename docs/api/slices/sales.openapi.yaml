openapi: 3.1.0
info:
  title: Greenhouse API Slice - sales
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/sales-slips/{salesSlipId}:
    get:
      tags:
      - sales-controller
      operationId: getSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
    put:
      tags:
      - sales-controller
      operationId: updateSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips:
    get:
      tags:
      - sales-controller
      operationId: getSalesSlips
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesSlipResponse'
      deprecated: true
    post:
      tags:
      - sales-controller
      operationId: createSalesSlip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{salesSlipId}/confirm-payment:
    post:
      tags:
      - sales-controller
      operationId: confirmPayment
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{salesSlipId}/sales-status:
    patch:
      tags:
      - sales-controller
      operationId: updateSalesStatus
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales/orchid-groups/search:
    get:
      tags:
      - sales-controller
      operationId: searchSalesOrchidGroups
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: varietyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesOrchidGroupSearchResponse'
  /api/sales-slips/{salesSlipId}/print:
    get:
      tags:
      - print-controller
      operationId: getSalesSlipPrintData
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/print:
    get:
      tags:
      - print-controller
      operationId: getPrintableSalesSlips
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
  /api/sales-slips/page:
    get:
      tags:
      - sales-controller
      operationId: getSalesSlipPage
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: paymentStatus
        in: query
        required: false
        schema:
          type: string
      - name: salesStatus
        in: query
        required: false
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
  /api/sales-slips/auction-shipments:
    get:
      tags:
      - sales-controller
      operationId: getAuctionShipmentOptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAuctionShipmentOptionResponse'
components:
  schemas:
    ApiResponseListAuctionShipmentOptionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuctionShipmentOptionResponse'
        message:
          type: string
    ApiResponseListSalesOrchidGroupSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrchidGroupSearchResponse'
        message:
          type: string
    ApiResponseListSalesSlipResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    ApiResponsePageResponseSalesSlipListItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseSalesSlipListItemResponse'
        message:
          type: string
    ApiResponseSalesSlipResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    AuctionShipmentOptionResponse:
      type: object
      properties:
        auctionHouseId:
          type: integer
          format: int64
        auctionMarket:
          type: string
        id:
          type: integer
          format: int64
        lots:
          type: array
          items:
            $ref: '#/components/schemas/Lot'
        shipmentDate:
          type: string
          format: date
    BusinessPartnerResponse:
      type: object
      properties:
        active:
          type: boolean
        address:
          type: string
        id:
          type: integer
          format: int64
        memo:
          type: string
        name:
          type: string
        ownerName:
          type: string
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        phone:
          type: string
    Lot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
        shipmentGrade:
          type: string
        shippedQuantity:
          type: integer
          format: int32
        varietyName:
          type: string
    ManualPaymentRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        depositorName:
          type: string
          maxLength: 100
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          maxLength: 30
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - amount
      - idempotencyKey
      - paymentDate
    PageResponseSalesSlipListItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipListItemResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    SalesOrchidGroupSearchResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
        bedZoneName:
          type: string
        genus:
          type: string
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        physicalBedNumber:
          type: integer
          format: int32
        potSize:
          type: string
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        status:
          type: string
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
    SalesOrchidGroupSnapshotResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        allocatedQuantity:
          type: integer
          format: int32
        bedZoneId:
          type: integer
          format: int64
        bedZoneName:
          type: string
        captureSource:
          type: string
          enum:
          - LIVE
          - MIGRATED_CURRENT_STATE
        capturedAt:
          type: string
          format: date-time
        endPosition:
          type: number
        genus:
          type: string
        houseId:
          type: integer
          format: int64
        houseNumber:
          type: integer
          format: int32
        orchidGroupId:
          type: integer
          format: int64
        physicalBedId:
          type: integer
          format: int64
        physicalBedNumber:
          type: integer
          format: int32
        potSize:
          type: string
        potSizeCode:
          type: string
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        snapshotType:
          type: string
          enum:
          - CREATION
          - OUTBOUND
        startPosition:
          type: number
        status:
          type: string
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
    SalesSlipCreateRequest:
      type: object
      properties:
        auctionShipmentId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipItemRequest'
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        partnerId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          maxLength: 50
          minLength: 0
        paymentStatus:
          type: string
          maxLength: 50
          minLength: 0
        saleDate:
          type: string
          format: date
        salesStatus:
          type: string
          maxLength: 50
          minLength: 0
        salesType:
          type: string
          enum:
          - DIRECT
          - AUCTION
      required:
      - items
      - saleDate
    SalesSlipItemAllocationRequest:
      type: object
      properties:
        orchidGroupId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
      - orchidGroupId
      - quantity
    SalesSlipItemAllocationResponse:
      type: object
      properties:
        allocatedQuantity:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
        bedZoneName:
          type: string
        creationSnapshot:
          $ref: '#/components/schemas/SalesOrchidGroupSnapshotResponse'
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        orchidGroupId:
          type: integer
          format: int64
        outboundSnapshot:
          $ref: '#/components/schemas/SalesOrchidGroupSnapshotResponse'
        physicalBedNumber:
          type: integer
          format: int32
        varietyName:
          type: string
    SalesSlipItemRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipItemAllocationRequest'
        genus:
          type: string
          maxLength: 100
          minLength: 0
        itemName:
          type: string
          maxLength: 150
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        quantity:
          type: integer
          format: int32
          minimum: 1
        spec:
          type: string
          maxLength: 100
          minLength: 0
        unitPrice:
          type: integer
          format: int32
          minimum: 0
      required:
      - allocations
      - itemName
      - quantity
      - unitPrice
    SalesSlipItemResponse:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipItemAllocationResponse'
        amount:
          type: integer
          format: int32
        auctionShipmentLotId:
          type: integer
          format: int64
        genus:
          type: string
        id:
          type: integer
          format: int64
        itemName:
          type: string
        memo:
          type: string
        quantity:
          type: integer
          format: int32
        spec:
          type: string
        unitPrice:
          type: integer
          format: int32
    SalesSlipListItemResponse:
      type: object
      properties:
        auctionMarket:
          type: string
        auctionShipmentId:
          type: integer
          format: int64
        expectedPaymentDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        memo:
          type: string
        paidAmount:
          type: integer
          format: int64
        partner:
          $ref: '#/components/schemas/BusinessPartnerResponse'
        paymentMethod:
          type: string
        paymentStatus:
          type: string
        remainingAmount:
          type: integer
          format: int64
        saleDate:
          type: string
          format: date
        salesStatus:
          type: string
        salesType:
          type: string
          enum:
          - DIRECT
          - AUCTION
        slipNumber:
          type: string
        totalAmount:
          type: integer
          format: int32
    SalesSlipResponse:
      type: object
      properties:
        auctionMarket:
          type: string
        auctionShipmentId:
          type: integer
          format: int64
        availableActions:
          type: array
          items:
            type: string
            enum:
            - EDIT
            - COMPLETE
            - CANCEL
            - CONFIRM_PAYMENT
        expectedPaymentDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipItemResponse'
        memo:
          type: string
        paidAmount:
          type: integer
          format: int64
        partner:
          $ref: '#/components/schemas/BusinessPartnerResponse'
        paymentMethod:
          type: string
        paymentStatus:
          type: string
        remainingAmount:
          type: integer
          format: int64
        saleDate:
          type: string
          format: date
        salesStatus:
          type: string
        salesType:
          type: string
          enum:
          - DIRECT
          - AUCTION
        slipNumber:
          type: string
        totalAmount:
          type: integer
          format: int32
    SalesSlipStatusUpdateRequest:
      type: object
      properties:
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        salesStatus:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - salesStatus

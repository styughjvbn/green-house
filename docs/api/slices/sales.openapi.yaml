openapi: 3.1.0
info:
  title: Greenhouse API Slice - sales
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/sales-slips/{salesSlipId}:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - sales-controller
      operationId: updateSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '200':
          description: 수정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_REVIEW_REQUIRED: 금액·배분 검토 필요. DIRECT_AMOUNT_SOURCE_MISSING: 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlips
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
    post:
      tags:
      - sales-controller
      description: recordOnly=true는 이미 완료된 판매·출하를 빈 allocation과 완료 상태로 기록하며 재고·예약·Farm snapshot을 만들지 않습니다. 경매는 새 출하·lot를 생성하므로
        기존 출하를 중복 등록하지 않아야 합니다. 기록 등록의 생성 키는 필수입니다. 출고·출하와 수납은 독립적입니다. 일반 판매의 최초 수납은 전표 생성과 같은 트랜잭션으로 기록하며 생성 키가 필수입니다. 받은
        전액을 기록하고 전표 총액까지 배분하며 초과분은 거래처 미배분 잔액으로 남깁니다. 수납 상태만으로 완납을 지정할 수 없습니다.
      operationId: createSalesSlip
      parameters:
      - name: Idempotency-Key
        in: header
        description: 생성 재전송은 같은 키와 입력을 유지합니다. 키 생략 시 별도 신규 전표를 생성합니다.
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{salesSlipId}/confirm-payment:
    post:
      tags:
      - sales-controller
      description: 받은 전액을 기록하고 전표 잔액까지만 배분하며 초과액은 거래처 미배분 잔액으로 남깁니다. 대상별 같은 키·금액·입금일의 재요청은 기존 반영 결과를 반환합니다. 같은 키의 금액/입금일 변경은
        409 IDEMPOTENCY_KEY_REUSED입니다.
      operationId: confirmPayment
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentRequest'
        required: true
      responses:
        '200':
          description: 입금 확인 또는 재요청 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '400':
          description: 'VALIDATION_ERROR: 입력 오류 또는 배분할 대상 잔액 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'IDEMPOTENCY_KEY_REUSED: 같은 대상·키의 금액 또는 입금일 변경. DIRECT_AMOUNT_REVIEW_REQUIRED: 금액·배분 검토 필요. DIRECT_AMOUNT_SOURCE_MISSING:
            금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips/{id}/direct-changes/{changeId}/cancel:
    post:
      tags:
      - sales-controller
      description: 후속 사용이 없는 가격 조정 또는 반품을 취소 이력으로 되돌립니다. 원기록은 삭제하지 않습니다.
      operationId: cancelDirectSaleChange
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: changeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/{id}/direct-changes/returns:
    post:
      tags:
      - sales-controller
      description: 선택한 가격 구간의 수량·금액을 반품 이력으로 기록합니다. 실제 농장 도착·재고 반영·현금 환불을 실행하지 않습니다.
      operationId: recordDirectSaleReturn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/{id}/direct-changes/price-adjustments:
    post:
      tags:
      - sales-controller
      description: 원가격 구간의 일부 수량을 새 단가로 조정합니다. 원품목·재고·수납은 보존하며 현재 거래금액을 갱신합니다. 같은 키·입력은 최초 변경 ID를 반환합니다.
      operationId: adjustDirectSalePrices
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/{salesSlipId}/sales-status:
    patch:
      tags:
      - sales-controller
      operationId: updateSalesStatus
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: 상태 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales/orchid-groups/search:
    get:
      tags:
      - sales-controller
      operationId: searchSalesOrchidGroups
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: varietyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesOrchidGroupSearchResponse'
  /api/sales-slips/{salesSlipId}/print:
    get:
      tags:
      - print-controller
      operationId: getSalesSlipPrintData
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{id}/direct-changes:
    get:
      tags:
      - sales-controller
      operationId: getDirectSaleChanges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResponse'
  /api/sales-slips/print:
    get:
      tags:
      - print-controller
      operationId: getPrintableSalesSlips
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
  /api/sales-slips/page:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlipPage
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: paymentStatus
        in: query
        required: false
        schema:
          type: string
      - name: salesStatus
        in: query
        description: 완료는 출고 완료·출하 완료를 포함하며 판매 유형 조건과 함께 적용합니다. 기존 개별 상태 검색도 지원합니다.
        required: false
        schema:
          type: string
      - name: salesType
        in: query
        required: false
        schema:
          type: string
          enum:
          - DIRECT
          - AUCTION
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips/auction-shipments:
    get:
      tags:
      - sales-controller
      operationId: getAuctionShipmentOptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAuctionShipmentOptionResponse'
components:
  schemas:
    ApiResponseDirectSaleChangeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectSaleChangeResponse'
        message:
          type: string
    ApiResponseDirectSaleChangeResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectSaleChangeResult'
        message:
          type: string
    ApiResponseListAuctionShipmentOptionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuctionShipmentOptionResponse'
        message:
          type: string
    ApiResponseListSalesOrchidGroupSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrchidGroupSearchResponse'
        message:
          type: string
    ApiResponseListSalesSlipResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    ApiResponsePageResponseSalesSlipListItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseSalesSlipListItemResponse'
        message:
          type: string
    ApiResponseSalesSlipResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    AuctionShipmentOptionResponse:
      type: object
      properties:
        auctionHouseId:
          type: integer
          format: int64
        auctionMarket:
          type: string
        id:
          type: integer
          format: int64
        lots:
          type: array
          items:
            $ref: '#/components/schemas/Lot'
        shipmentDate:
          type: string
          format: date
    BusinessPartnerResponse:
      type: object
      properties:
        active:
          type: boolean
        address:
          type: string
        id:
          type: integer
          format: int64
        memo:
          type: string
        name:
          type: string
        ownerName:
          type: string
        partnerType:
          type: string
          enum:
          - WHOLESALE
          - RETAIL
          - AUCTION_HOUSE
        phone:
          type: string
    CancelDirectSaleChangeRequest:
      type: object
      properties:
        changeDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - changeDate
      - reason
    DirectSaleChangeRequest:
      type: object
      properties:
        changeDate:
          type: string
          format: date
        itemId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        reason:
          type: string
          maxLength: 500
          minLength: 0
        sourceChangeId:
          type: integer
          format: int64
        unitPrice:
          type: integer
          format: int32
      required:
      - changeDate
      - itemId
      - quantity
      - reason
    DirectSaleChangeResponse:
      type: object
      properties:
        availableTypes:
          type: array
          items:
            type: string
            enum:
            - PRICE_ADJUSTMENT
            - RETURN
            - CANCEL
        currentAmount:
          type: integer
          format: int32
        documentId:
          type: integer
          format: int64
        history:
          $ref: '#/components/schemas/PageResponseHistory'
        originalAmount:
          type: integer
          format: int64
        portions:
          type: array
          items:
            $ref: '#/components/schemas/Portion'
        refundDueAmount:
          type:
          - integer
          - 'null'
          format: int64
          description: 현재 수납 배분이 거래금액을 초과한 환불 필요액. 검토 대상은 미상이며 실제 환불 기록이 아닙니다.
        returnedPortions:
          type: array
          description: 취소되지 않은 반품의 가격 구간별 수량·단가·비음수 금액. 이력 페이지와 무관한 전체 구성이며 현재 거래금액에서 제외됩니다.
          items:
            $ref: '#/components/schemas/Portion'
    DirectSaleChangeResult:
      type: object
      properties:
        changeId:
          type: integer
          format: int64
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    History:
      type: object
      properties:
        amountDelta:
          type: integer
          format: int64
        cancelAllowed:
          type: boolean
        canceled:
          type: boolean
        canceledChangeId:
          type: integer
          format: int64
        changeDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        itemName:
          type: string
        nextUnitPrice:
          type: integer
          format: int32
        previousUnitPrice:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        reason:
          type: string
        sourceChangeId:
          type: integer
          format: int64
        type:
          type: string
          enum:
          - PRICE_ADJUSTMENT
          - RETURN
          - CANCEL
    Lot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
        shipmentGrade:
          type: string
        shippedQuantity:
          type: integer
          format: int32
        varietyName:
          type: string
    ManualPaymentRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        depositorName:
          type: string
          maxLength: 100
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          maxLength: 30
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - amount
      - idempotencyKey
      - paymentDate
    PageResponseHistory:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/History'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseSalesSlipListItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipListItemResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Portion:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        itemName:
          type: string
        quantity:
          type: integer
          format: int32
        sourceChangeId:
          type:
          - integer
          - 'null'
          format: int64
          description: 원가격 구간이면 null, 조정가격 구간이면 해당 가격 조정 ID
        spec:
          type: string
        unitPrice:
          type: integer
          format: int32
    SalesInitialReceiptRequest:
      type: object
      description: 실제 받은 전액을 기록합니다. 전표 총액까지 배분하고 초과분은 거래처 미배분 잔액으로 남깁니다.
      properties:
        amount:
          type: integer
          format: int64
        method:
          type: string
          enum:
          - CASH
          - BANK_TRANSFER
        paymentDate:
          type: string
          format: date
      required:
      - amount
      - method
      - paymentDate
    SalesOrchidGroupSearchResponse:
      type: object
      properties:
        ageYear:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
        bedZoneName:
          type: string
        genus:
          type: string
        houseNumber:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        physicalBedNumber:
          type: integer
          format: int32
        potSize:
          type: string
        quantity:
          type: integer
          format: int32
        reservedQuantity:
          type: integer
          format: int32
        status:
          type: string
        varietyId:
          type: integer
          format: int64
        varietyName:
          type: string
    SalesOrchidGroupSnapshotResponse:
      type: object
      properties:

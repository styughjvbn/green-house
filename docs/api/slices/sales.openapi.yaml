openapi: 3.1.0
info:
  title: Greenhouse API Slice - sales
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/sales-slips/{salesSlipId}:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - sales-controller
      operationId: updateSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '200':
          description: 수정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_REVIEW_REQUIRED: 금액·배분 검토 필요. DIRECT_AMOUNT_SOURCE_MISSING: 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlips
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
    post:
      tags:
      - sales-controller
      description: recordOnly=true는 이미 완료된 판매·출하를 빈 allocation과 완료 상태로 기록하며 재고·예약·Farm snapshot을 만들지 않습니다. 경매는 새 출하·lot를 생성하므로
        기존 출하를 중복 등록하지 않아야 합니다. 기록 등록의 생성 키는 필수입니다. 출고·출하와 수납은 독립적입니다. 일반 판매의 최초 수납은 전표 생성과 같은 트랜잭션으로 기록하며 생성 키가 필수입니다. 받은
        전액을 기록하고 전표 총액까지 배분하며 초과분은 거래처 미배분 잔액으로 남깁니다. 수납 상태만으로 완납을 지정할 수 없습니다.
      operationId: createSalesSlip
      parameters:
      - name: Idempotency-Key
        in: header
        description: 생성 재전송은 같은 키와 입력을 유지합니다. 키 생략 시 별도 신규 전표를 생성합니다.
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{salesSlipId}/confirm-payment:
    post:
      tags:
      - sales-controller
      description: 받은 전액을 기록하고 전표 잔액까지만 배분하며 초과액은 거래처 미배분 잔액으로 남깁니다. 대상별 같은 키·금액·입금일의 재요청은 기존 반영 결과를 반환합니다. 같은 키의 금액/입금일 변경은
        409 IDEMPOTENCY_KEY_REUSED입니다.
      operationId: confirmPayment
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentRequest'
        required: true
      responses:
        '200':
          description: 입금 확인 또는 재요청 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '400':
          description: 'VALIDATION_ERROR: 입력 오류 또는 배분할 대상 잔액 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'IDEMPOTENCY_KEY_REUSED: 같은 대상·키의 금액 또는 입금일 변경. DIRECT_AMOUNT_REVIEW_REQUIRED: 금액·배분 검토 필요. DIRECT_AMOUNT_SOURCE_MISSING:
            금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips/{id}/direct-changes/{returnId}/arrivals:
    post:
      tags:
      - sales-controller
      description: 반품 도착을 기록합니다. 새 묶음 생성 또는 이미 재고에 반영된 도착의 기록만 등록을 선택합니다. 원판매·금액·수납은 변경하지 않습니다.
      operationId: recordDirectReturnArrival
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: returnId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectReturnArrivalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectReturnArrivalResult'
  /api/sales-slips/{id}/direct-changes/{changeId}/cancel:
    post:
      tags:
      - sales-controller
      description: 후속 사용이 없는 가격 조정 또는 반품을 취소 이력으로 되돌립니다. 원기록은 삭제하지 않습니다.
      operationId: cancelDirectSaleChange
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: changeId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/{id}/direct-changes/returns:
    post:
      tags:
      - sales-controller
      description: 선택한 가격 구간의 수량·금액을 반품 이력으로 기록합니다. 실제 농장 도착·재고 반영·현금 환불을 실행하지 않습니다.
      operationId: recordDirectSaleReturn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/{id}/direct-changes/return-arrivals/{arrivalId}/cancel:
    post:
      tags:
      - sales-controller
      description: 도착 이력을 보존해 취소합니다. 새 묶음을 생성한 경우에만 Farm 생성 Mutation을 보상하며 후속 사용이 있으면 거절합니다.
      operationId: cancelDirectReturnArrival
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: arrivalId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDirectReturnArrivalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectReturnArrivalResult'
  /api/sales-slips/{id}/direct-changes/price-adjustments:
    post:
      tags:
      - sales-controller
      description: 원가격 구간의 일부 수량을 새 단가로 조정합니다. 원품목·재고·수납은 보존하며 현재 거래금액을 갱신합니다. 같은 키·입력은 최초 변경 ID를 반환합니다.
      operationId: adjustDirectSalePrices
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectSaleChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResult'
  /api/sales-slips/image-previews:
    post:
      tags:
      - sales-controller
      description: 원본은 보존하고 전표 사진의 보정·문서 분리·빈 행 제거 결과를 임시 미리보기로 생성합니다. 판매 저장과 AI 입력에는 반영하지 않습니다. 미리보기는 5분 후 만료됩니다.
      operationId: prepare
      parameters:
      - name: rotationDegrees
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: -1
      - name: minimumInkRatio
        in: query
        description: 빈 행 판정 잉크 비율. 0.015는 1.5%이며, 이 값 이하인 행을 빈 행으로 판정합니다.
        required: false
        schema:
          type: number
          format: double
          default: 0.015
          maximum: 0.1
          minimum: 0
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipImagePreview'
  /api/sales-slips/{salesSlipId}/sales-status:
    patch:
      tags:
      - sales-controller
      operationId: updateSalesStatus
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: 상태 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales/orchid-groups/search:
    get:
      tags:
      - sales-controller
      operationId: searchSalesOrchidGroups
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: varietyId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListSalesOrchidGroupSearchResponse'
  /api/sales-slips/{salesSlipId}/print:
    get:
      tags:
      - print-controller
      operationId: getSalesSlipPrintData
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
  /api/sales-slips/{id}/source-photo:
    get:
      tags:
      - sales-controller
      description: 인증된 전표 사진 조회. JPEG/PNG 최대 8MB. 저장된 사진의 Base64 데이터를 반환합니다.
      operationId: getPhoto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePhotoContent'
  /api/sales-slips/{id}/source-photo/info:
    get:
      tags:
      - sales-controller
      description: 전표 첨부 사진의 메타데이터. 사진이 없으면 data=null. 전표 취소 후에도 보존합니다.
      operationId: getPhotoInfo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePhotoInfo'
  /api/sales-slips/{id}/direct-changes:
    get:
      tags:
      - sales-controller
      operationId: getDirectSaleChanges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectSaleChangeResponse'
  /api/sales-slips/{id}/direct-changes/return-arrivals:
    get:
      tags:
      - sales-controller
      operationId: getDirectReturnArrivals
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDirectReturnArrivalState'
  /api/sales-slips/print:
    get:
      tags:
      - print-controller
      operationId: getPrintableSalesSlips
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
  /api/sales-slips/page:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlipPage
      parameters:
      - name: partnerId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: paymentStatus
        in: query
        required: false
        schema:
          type: string
      - name: salesStatus
        in: query
        description: 완료는 출고 완료·출하 완료를 포함하며 판매 유형 조건과 함께 적용합니다. 기존 개별 상태 검색도 지원합니다.
        required: false
        schema:
          type: string
      - name: salesType
        in: query
        required: false
        schema:
          type: string
          enum:
          - DIRECT
          - AUCTION
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseSalesSlipListItemResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sales-slips/image-previews/{id}/images/{imageId}:
    get:
      tags:
      - sales-controller
      operationId: image
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: byte
  /api/sales-slips/auction-shipments:
    get:
      tags:
      - sales-controller
      operationId: getAuctionShipmentOptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAuctionShipmentOptionResponse'
  /api/sales-slips/image-previews/{id}:
    delete:
      tags:
      - sales-controller
      operationId: remove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
components:
  schemas:
    ApiResponseDirectReturnArrivalResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectReturnArrivalResult'
        message:
          type: string
    ApiResponseDirectReturnArrivalState:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectReturnArrivalState'
        message:
          type: string
    ApiResponseDirectSaleChangeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectSaleChangeResponse'
        message:
          type: string
    ApiResponseDirectSaleChangeResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DirectSaleChangeResult'
        message:
          type: string
    ApiResponseListAuctionShipmentOptionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuctionShipmentOptionResponse'
        message:
          type: string
    ApiResponseListSalesOrchidGroupSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrchidGroupSearchResponse'
        message:
          type: string
    ApiResponseListSalesSlipResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    ApiResponsePageResponseSalesSlipListItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseSalesSlipListItemResponse'
        message:
          type: string
    ApiResponsePhotoContent:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PhotoContent'
        message:
          type: string
    ApiResponsePhotoInfo:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PhotoInfo'
        message:
          type: string
    ApiResponseSalesSlipImagePreview:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesSlipImagePreview'
        message:
          type: string
    ApiResponseSalesSlipResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SalesSlipResponse'
        message:
          type: string
    ApiResponseVoid:
      type: object
      properties:
        data: {}
        message:
          type: string
    AuctionShipmentOptionResponse:
      type: object
      properties:
        auctionHouseId:
          type: integer
          format: int64
        auctionMarket:
          type: string
        id:
          type: integer
          format: int64
        lots:
          type: array
          items:
            $ref: '#/components/schemas/Lot'

openapi: 3.1.0
info:
  title: Greenhouse API Slice - auction
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/auction-settlements/rebuild:
    post:
      tags:
      - auction-settlement-controller
      operationId: rebuild
      parameters:
      - name: auctionHouseId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: auctionDate
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementResponse'
  /api/auction-proceeds/{id}/confirm-payment:
    post:
      tags:
      - auction-proceeds-controller
      description: 자료 연결과 받을 금액이 확인된 경매 대금에 입금을 배분합니다. 같은 키·금액·입금일은 중복 수납 없이 현재 조회를 반환합니다.
      operationId: confirmPayment_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionProceedsResponse'
  /api/auction-lots/{id}/results:
    post:
      tags:
      - auction-tracking-controller
      operationId: addResult
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotResultRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/follow-up:
    get:
      tags:
      - auction-tracking-controller
      operationId: getFollowUp
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionFollowUpResponse'
    post:
      tags:
      - auction-tracking-controller
      operationId: decideFollowUp
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionFollowUpCommand'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionFollowUpResult'
  /api/auction-lots/{id}/confirm-return:
    post:
      tags:
      - auction-tracking-controller
      operationId: confirmReturn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/arrivals:
    get:
      tags:
      - auction-tracking-controller
      operationId: getArrivals
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionArrivalResponse'
    post:
      tags:
      - auction-tracking-controller
      operationId: recordArrival
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionArrivalCommand'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionFollowUpResult'
  /api/auction-lots/{id}/arrivals/{arrivalId}/cancel:
    post:
      tags:
      - auction-tracking-controller
      operationId: cancelArrival
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: arrivalId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAuctionArrivalCommand'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionFollowUpResult'
  /api/auction-lots/{id}/adjust-quantity:
    post:
      tags:
      - auction-tracking-controller
      operationId: adjust
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotAdjustmentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/status:
    patch:
      tags:
      - auction-tracking-controller
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-tracking/summary:
    get:
      tags:
      - auction-tracking-controller
      operationId: getSummary_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionTrackingSummaryResponse'
  /api/auction-settlements:
    get:
      tags:
      - auction-settlement-controller
      description: 호환용 목록. 최신 500건만 반환합니다. 운영 목록은 /page, 전체 합계는 /summary를 사용합니다.
      operationId: getSettlements
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAuctionSettlementResponse'
      deprecated: true
  /api/auction-settlements/{settlementId}:
    get:
      tags:
      - auction-settlement-controller
      operationId: getSettlement
      parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementResponse'
  /api/auction-settlements/summary:
    get:
      tags:
      - auction-settlement-controller
      description: 조회 조건에 해당하는 전체 정산의 합계. 페이지 크기와 무관하게 집계합니다.
      operationId: getAuctionSettlementSummary
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementSummaryResponse'
  /api/auction-settlements/page:
    get:
      tags:
      - auction-settlement-controller
      description: 정산 요약의 서버 페이지 목록. page는 0 이상, size는 1~100으로 보정합니다. 상세 행은 단건 API에서 조회합니다.
      operationId: getAuctionSettlementPage
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionSettlementListItemResponse'
  /api/auction-proceeds/{id}:
    get:
      tags:
      - auction-proceeds-controller
      operationId: get_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionProceedsResponse'
  /api/auction-proceeds/page:
    get:
      tags:
      - auction-proceeds-controller
      operationId: page
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionProceedsResponse'
  /api/auction-lots:
    get:
      tags:
      - auction-tracking-controller
      operationId: getLots
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: market
        in: query
        required: false
        schema:
          type: string
      - name: variety
        in: query
        required: false
        schema:
          type: string
      - name: grade
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
          - DISPOSED
      - name: reviewOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: returnOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: waitingOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionLotResponse'
  /api/auction-lots/{id}:
    get:
      tags:
      - auction-tracking-controller
      operationId: getLot
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/timeline:
    get:
      tags:
      - auction-tracking-controller
      operationId: getTimeline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
components:
  schemas:
    ApiResponseAuctionFollowUpResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionFollowUpResponse'
        message:
          type: string
    ApiResponseAuctionFollowUpResult:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionFollowUpResult'
        message:
          type: string
    ApiResponseAuctionLotResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionLotResponse'
        message:
          type: string
    ApiResponseAuctionProceedsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionProceedsResponse'
        message:
          type: string
    ApiResponseAuctionSettlementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionSettlementResponse'
        message:
          type: string
    ApiResponseAuctionSettlementSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionSettlementSummaryResponse'
        message:
          type: string
    ApiResponseAuctionTrackingSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionTrackingSummaryResponse'
        message:
          type: string
    ApiResponseListAuctionSettlementResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuctionSettlementResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionArrivalResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionArrivalResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionLotResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionLotResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionProceedsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionProceedsResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionSettlementListItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionSettlementListItemResponse'
        message:
          type: string
    AuctionArrivalCommand:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date
        bedZoneId:
          type: integer
          format: int64
        details:
          $ref: '#/components/schemas/OrchidGroupMutationDetails'
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - arrivalDate
      - bedZoneId
      - details
      - idempotencyKey
    AuctionArrivalResponse:
      type: object
      properties:
        arrivalDate:
          type: string
          format: date
        canceledAt:
          type: string
          format: date-time
        cancellationMutationId:
          type: integer
          format: int64
        cancellationReason:
          type: string
        createdAt:
          type: string
          format: date-time
        creationMutationId:
          type: integer
          format: int64
        decisionId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        lotId:
          type: integer
          format: int64
        orchidGroupId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        worker:
          type: string
    AuctionAttemptResponse:
      type: object
      properties:
        attemptNo:
          type: integer
          format: int32
        attemptStatus:
          type: string
          enum:
          - SOLD
          - FAILED
          - PARTIALLY_SOLD
          - RETURN_INFERRED
        auctionDate:
          type: string
          format: date
        failedReason:
          type: string
        id:
          type: integer
          format: int64
        memo:
          type: string
        resultLines:
          type: array
          items:
            $ref: '#/components/schemas/AuctionResultLineResponse'
    AuctionFollowUpCommand:
      type: object
      properties:
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 0
        method:
          type: string
          enum:
          - REAUCTION
          - FARM_RETURN
          - AUCTION_DISPOSAL
        reason:
          type: string
          maxLength: 1000
          minLength: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - idempotencyKey
      - method
      - reason
    AuctionFollowUpResponse:
      type: object
      properties:
        arrivalAllowed:
          type: boolean
        availableMethods:
          type: array
          items:
            type: string
            enum:
            - REAUCTION
            - FARM_RETURN
            - AUCTION_DISPOSAL
        decidedQuantity:
          type: integer
          format: int32
        decisionChangeAllowed:
          type: boolean
        decisionId:
          type: integer
          format: int64
        disposedQuantity:
          type: integer
          format: int32
        inferredReturnQuantity:
          type: integer
          format: int32
        lotId:
          type: integer
          format: int64
        method:
          type: string
          enum:
          - REAUCTION
          - FARM_RETURN
          - AUCTION_DISPOSAL
        pendingQuantity:
          type: integer
          format: int32
    AuctionFollowUpResult:
      type: object
      properties:
        arrival:
          $ref: '#/components/schemas/AuctionArrivalResponse'
        followUp:
          $ref: '#/components/schemas/AuctionFollowUpResponse'
    AuctionLotAdjustmentRequest:
      type: object
      properties:
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        returnedQuantity:
          type: integer
          format: int32
          minimum: 0
        soldQuantity:
          type: integer
          format: int32
          minimum: 0
        waitingQuantity:
          type: integer
          format: int32
          minimum: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - returnedQuantity
      - soldQuantity
      - waitingQuantity
    AuctionLotResponse:
      type: object
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AuctionAttemptResponse'
        auctionMarket:
          type: string
        boxes:
          type: integer
          format: int32
        currentStatus:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
          - DISPOSED
        failedCount:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        inspectionStatus:
          type: string
          enum:
          - NORMAL
          - AUTO_MATCHED
          - CORRECTED_MATCH
          - MANUAL_REVIEW
          - MATCH_FAILED
          - QUANTITY_MISMATCH
          - RETURN_INFERRED
          - SOURCE_ERROR
        itemName:
          type: string
        latestAuctionDate:
          type: string
          format: date
        memo:
          type: string
        quantityAdjustmentAllowed:
          type:
          - boolean
          - 'null'
        returnConfirmableQuantity:
          type: integer
          format: int32
        returnConfirmedDate:
          type: string
          format: date
        returnedQuantity:
          type: integer
          format: int32
        shipmentDate:
          type: string
          format: date
        shipmentGrade:
          type: string
        shippedQuantity:
          type: integer
          format: int32
        soldQuantity:
          type: integer
          format: int32
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/AuctionStatusHistoryResponse'
        totalAmount:
          type: integer
          format: int32
        varietyName:
          type: string
        waitingQuantity:
          type: integer
          format: int32
    AuctionLotResultLineRequest:
      type: object
      properties:
        auctionGrade:
          type: string
          maxLength: 100
          minLength: 0
        inspectionStatus:
          type: string
          enum:
          - NORMAL
          - AUTO_MATCHED
          - CORRECTED_MATCH
          - MANUAL_REVIEW
          - MATCH_FAILED
          - QUANTITY_MISMATCH
          - RETURN_INFERRED
          - SOURCE_ERROR
        note:
          type: string
          maxLength: 1000
          minLength: 0
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: integer
          format: int32
          minimum: 0
      required:
      - quantity
      - unitPrice
    AuctionLotResultRequest:
      type: object
      properties:
        attemptNo:
          type: integer
          format: int32
          minimum: 1
        attemptStatus:
          type: string
          enum:
          - SOLD
          - FAILED
          - PARTIALLY_SOLD
          - RETURN_INFERRED
        auctionDate:
          type: string
          format: date
        failedReason:
          type: string
          maxLength: 200
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 1
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        resultLines:
          type: array
          items:
            $ref: '#/components/schemas/AuctionLotResultLineRequest'
      required:
      - attemptStatus
      - auctionDate
      - idempotencyKey
    AuctionLotReturnRequest:
      type: object
      properties:
        idempotencyKey:

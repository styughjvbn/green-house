openapi: 3.1.0
info:
  title: Greenhouse API Slice - auction
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/auction-settlements/rebuild:
    post:
      tags:
      - auction-settlement-controller
      operationId: rebuild
      parameters:
      - name: auctionHouseId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: auctionDate
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementResponse'
  /api/auction-lots/{id}/results:
    post:
      tags:
      - auction-tracking-controller
      operationId: addResult
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotResultRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/confirm-return:
    post:
      tags:
      - auction-tracking-controller
      operationId: confirmReturn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/adjust-quantity:
    post:
      tags:
      - auction-tracking-controller
      operationId: adjust
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotAdjustmentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/status:
    patch:
      tags:
      - auction-tracking-controller
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionLotStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-tracking/summary:
    get:
      tags:
      - auction-tracking-controller
      operationId: getSummary_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionTrackingSummaryResponse'
  /api/auction-settlements:
    get:
      tags:
      - auction-settlement-controller
      description: 호환용 목록. 최신 500건만 반환합니다. 운영 목록은 /page, 전체 합계는 /summary를 사용합니다.
      operationId: getSettlements
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAuctionSettlementResponse'
      deprecated: true
  /api/auction-settlements/{settlementId}:
    get:
      tags:
      - auction-settlement-controller
      operationId: getSettlement
      parameters:
      - name: settlementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementResponse'
  /api/auction-settlements/summary:
    get:
      tags:
      - auction-settlement-controller
      description: 조회 조건에 해당하는 전체 정산의 합계. 페이지 크기와 무관하게 집계합니다.
      operationId: getAuctionSettlementSummary
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionSettlementSummaryResponse'
  /api/auction-settlements/page:
    get:
      tags:
      - auction-settlement-controller
      description: 정산 요약의 서버 페이지 목록. page는 0 이상, size는 1~100으로 보정합니다. 상세 행은 단건 API에서 조회합니다.
      operationId: getAuctionSettlementPage
      parameters:
      - name: auctionHouseId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionSettlementListItemResponse'
  /api/auction-lots:
    get:
      tags:
      - auction-tracking-controller
      operationId: getLots
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: market
        in: query
        required: false
        schema:
          type: string
      - name: variety
        in: query
        required: false
        schema:
          type: string
      - name: grade
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
      - name: reviewOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: returnOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: waitingOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseAuctionLotResponse'
  /api/auction-lots/{id}:
    get:
      tags:
      - auction-tracking-controller
      operationId: getLot
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
  /api/auction-lots/{id}/timeline:
    get:
      tags:
      - auction-tracking-controller
      operationId: getTimeline
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuctionLotResponse'
components:
  schemas:
    ApiResponseAuctionLotResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionLotResponse'
        message:
          type: string
    ApiResponseAuctionSettlementResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionSettlementResponse'
        message:
          type: string
    ApiResponseAuctionSettlementSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionSettlementSummaryResponse'
        message:
          type: string
    ApiResponseAuctionTrackingSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuctionTrackingSummaryResponse'
        message:
          type: string
    ApiResponseListAuctionSettlementResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuctionSettlementResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionLotResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionLotResponse'
        message:
          type: string
    ApiResponsePageResponseAuctionSettlementListItemResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageResponseAuctionSettlementListItemResponse'
        message:
          type: string
    AuctionAttemptResponse:
      type: object
      properties:
        attemptNo:
          type: integer
          format: int32
        attemptStatus:
          type: string
          enum:
          - SOLD
          - FAILED
          - PARTIALLY_SOLD
          - RETURN_INFERRED
        auctionDate:
          type: string
          format: date
        failedReason:
          type: string
        id:
          type: integer
          format: int64
        memo:
          type: string
        resultLines:
          type: array
          items:
            $ref: '#/components/schemas/AuctionResultLineResponse'
    AuctionLotAdjustmentRequest:
      type: object
      properties:
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        returnedQuantity:
          type: integer
          format: int32
          minimum: 0
        soldQuantity:
          type: integer
          format: int32
          minimum: 0
        waitingQuantity:
          type: integer
          format: int32
          minimum: 0
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - returnedQuantity
      - soldQuantity
      - waitingQuantity
    AuctionLotResponse:
      type: object
      properties:
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AuctionAttemptResponse'
        auctionMarket:
          type: string
        boxes:
          type: integer
          format: int32
        currentStatus:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
        failedCount:
          type: integer
          format: int32
        id:
          type: integer
          format: int64
        inspectionStatus:
          type: string
          enum:
          - NORMAL
          - AUTO_MATCHED
          - CORRECTED_MATCH
          - MANUAL_REVIEW
          - MATCH_FAILED
          - QUANTITY_MISMATCH
          - RETURN_INFERRED
          - SOURCE_ERROR
        itemName:
          type: string
        latestAuctionDate:
          type: string
          format: date
        memo:
          type: string
        quantityAdjustmentAllowed:
          type:
          - boolean
          - 'null'
        returnConfirmableQuantity:
          type: integer
          format: int32
        returnConfirmedDate:
          type: string
          format: date
        returnedQuantity:
          type: integer
          format: int32
        shipmentDate:
          type: string
          format: date
        shipmentGrade:
          type: string
        shippedQuantity:
          type: integer
          format: int32
        soldQuantity:
          type: integer
          format: int32
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/AuctionStatusHistoryResponse'
        totalAmount:
          type: integer
          format: int32
        varietyName:
          type: string
        waitingQuantity:
          type: integer
          format: int32
    AuctionLotResultLineRequest:
      type: object
      properties:
        auctionGrade:
          type: string
          maxLength: 100
          minLength: 0
        inspectionStatus:
          type: string
          enum:
          - NORMAL
          - AUTO_MATCHED
          - CORRECTED_MATCH
          - MANUAL_REVIEW
          - MATCH_FAILED
          - QUANTITY_MISMATCH
          - RETURN_INFERRED
          - SOURCE_ERROR
        note:
          type: string
          maxLength: 1000
          minLength: 0
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          type: integer
          format: int32
          minimum: 0
      required:
      - quantity
      - unitPrice
    AuctionLotResultRequest:
      type: object
      properties:
        attemptNo:
          type: integer
          format: int32
          minimum: 1
        attemptStatus:
          type: string
          enum:
          - SOLD
          - FAILED
          - PARTIALLY_SOLD
          - RETURN_INFERRED
        auctionDate:
          type: string
          format: date
        failedReason:
          type: string
          maxLength: 200
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 1
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        resultLines:
          type: array
          items:
            $ref: '#/components/schemas/AuctionLotResultLineRequest'
      required:
      - attemptStatus
      - auctionDate
      - idempotencyKey
    AuctionLotReturnRequest:
      type: object
      properties:
        idempotencyKey:
          type: string
          maxLength: 100
          minLength: 1
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        returnDate:
          type: string
          format: date
        returnedQuantity:
          type: integer
          format: int32
          minimum: 1
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - idempotencyKey
      - returnDate
    AuctionLotStatusRequest:
      type: object
      properties:
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        reason:
          type: string
          maxLength: 200
          minLength: 0
        status:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
        worker:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - reason
      - status
    AuctionResultLineResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int32
        auctionDate:
          type: string
          format: date
        auctionGrade:
          type: string
        id:
          type: integer
          format: int64
        inspectionStatus:
          type: string
          enum:
          - NORMAL
          - AUTO_MATCHED
          - CORRECTED_MATCH
          - MANUAL_REVIEW
          - MATCH_FAILED
          - QUANTITY_MISMATCH
          - RETURN_INFERRED
          - SOURCE_ERROR
        note:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: integer
          format: int32
    AuctionSettlementLineResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        auctionResultLineId:
          type: integer
          format: int64
        auctionShipmentLotId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipmentDate:
          type: string
          format: date
        shipmentGrade:
          type: string
        status:
          type: string
          enum:
          - UNPAID
          - PAID
          - PARTIALLY_PAID
          - EXCLUDED
          - REVIEW_REQUIRED
        unitPrice:
          type: integer
          format: int32
        varietyName:
          type: string
    AuctionSettlementListItemResponse:
      type: object
      properties:
        auctionDate:
          type: string
          format: date
        auctionHouseId:
          type: integer
          format: int64
        auctionHouseName:
          type: string
        expectedDepositAmount:
          type: integer
          format: int64
        grossAmount:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        remainingAmount:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
    AuctionSettlementResponse:
      type: object
      properties:
        auctionDate:
          type: string
          format: date
        auctionHouseId:
          type: integer
          format: int64
        auctionHouseName:
          type: string
        confirmedAt:
          type: string
          format: date-time
        confirmedBy:
          type: string
        deductionAmount:
          type: integer
          format: int64
        expectedDepositAmount:
          type: integer
          format: int64
        expectedPaymentDate:
          type: string
          format: date
        feeAmount:
          type: integer
          format: int64
        grossAmount:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AuctionSettlementLineResponse'
        memo:
          type: string
        paidAmount:
          type: integer
          format: int64
        remainingAmount:
          type: integer
          format: int64
        resultReceivedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - CREATED
          - PAYMENT_WAITING
          - PARTIALLY_PAID
          - PAID
          - AMOUNT_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
    AuctionSettlementSummaryResponse:
      type: object
      properties:
        expectedDepositAmount:
          type: integer
          format: int64
        remainingAmount:
          type: integer
          format: int64
    AuctionStatusHistoryResponse:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        memo:
          type: string
        newReturnedQuantity:
          type:
          - integer
          - 'null'
          format: int32
        newSoldQuantity:
          type:
          - integer
          - 'null'
          format: int32
        newStatus:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
        newWaitingQuantity:
          type:
          - integer
          - 'null'
          format: int32
        previousReturnedQuantity:
          type:
          - integer
          - 'null'
          format: int32
        previousSoldQuantity:
          type:
          - integer
          - 'null'
          format: int32
        previousStatus:
          type: string
          enum:
          - SHIPPED
          - WAITING
          - IN_PROGRESS
          - SOLD
          - PARTIALLY_SOLD
          - FAILED
          - REAUCTION_WAITING
          - RETURN_INFERRED
          - PARTIALLY_RETURNED
          - RETURNED
          - QUANTITY_MISMATCH
          - REVIEW_REQUIRED
          - CANCELLED
        previousWaitingQuantity:
          type:
          - integer
          - 'null'
          format: int32
        reason:
          type: string
        worker:
          type: string
    AuctionTrackingSummaryResponse:
      type: object
      properties:
        lotCount:
          type: integer
          format: int32
        returnedQuantity:
          type: integer
          format: int32
        reviewRequiredCount:
          type: integer
          format: int32
        shippedQuantity:
          type: integer
          format: int32
        soldQuantity:
          type: integer
          format: int32
        totalAmount:
          type: integer
          format: int32
        waitingQuantity:
          type: integer
          format: int32
    PageResponseAuctionLotResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuctionLotResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseAuctionSettlementListItemResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuctionSettlementListItemResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

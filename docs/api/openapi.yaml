      type: object
      properties:
        auctionShipmentId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesSlipItemRequest'
        memo:
          type: string
          maxLength: 1000
          minLength: 0
        partnerId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          maxLength: 50
          minLength: 0
        paymentStatus:
          type: string
          maxLength: 50
          minLength: 0
        saleDate:
          type: string
          format: date
        salesStatus:
          type: string
          maxLength: 50
          minLength: 0
        salesType:
          type: string

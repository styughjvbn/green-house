openapi: 3.1.0
info:
  title: Greenhouse Backend API
  description: 농장 관리 시스템 Backend API
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/sales-slips/{salesSlipId}:
    get:
      tags:
      - sales-controller
      description: 일반 판매 금액은 Direct 거래·가격과 실제 유효 배분에서 조회합니다.
      operationId: getSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_SOURCE_MISSING: 일반 판매 금액 자료 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - sales-controller
      operationId: updateSalesSlip
      parameters:
      - name: salesSlipId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesSlipCreateRequest'
        required: true
      responses:
        '200':
          description: 수정 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSalesSlipResponse'
        '409':
          description: 'DIRECT_AMOUNT_REVIEW_REQUIRED: 금액·배분 검토 필요. DIRECT_AMOUNT_SOURCE_MISSING: 금액 자료 없음. HISTORICAL_AUCTION_DOCUMENT_READ_ONLY:
            과거 이관 경매 전표 수정 차단'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

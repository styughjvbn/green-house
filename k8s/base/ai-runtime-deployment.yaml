apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-house-ai-runtime
  namespace: green-house
  labels:
    app.kubernetes.io/name: green-house
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: 1
  # One process owns the registration conversations and Codex session volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: green-house
      app.kubernetes.io/component: ai-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: green-house
        app.kubernetes.io/component: ai-runtime
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        - name: codex-home
          persistentVolumeClaim:
            claimName: green-house-ai-codex
      containers:
        - name: ai-runtime
          # Set the published release tag before applying.
          image: ghcr.io/styughjvbn/green-house-ai-runtime:sha-891ab99
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          volumeMounts:
            - name: codex-home
              mountPath: /var/lib/greenhouse-codex
          env:
            - name: NODE_ENV
              value: production
            - name: AI_HOST
              value: 0.0.0.0
            - name: AI_PORT
              value: "8091"
            - name: AI_CODEX_HOME
              value: /var/lib/greenhouse-codex
            - name: CODEX_HOME
              value: /var/lib/greenhouse-codex
            - name: AI_TOOLS_URL
              value: http://green-house-backend:8080
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: green-house-config
                  key: AI_PROVIDER
            - name: AI_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: green-house-config
                  key: AI_TIMEOUT_SECONDS
            - name: AI_MAX_TOOL_CALLS
              valueFrom:
                configMapKeyRef:
                  name: green-house-config
                  key: AI_MAX_TOOL_CALLS
            - name: AI_RUNTIME_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-house-ai-secret
                  key: AI_RUNTIME_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-house-ai-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: AI_OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: green-house-config
                  key: AI_OPENAI_MODEL
                  optional: true
            - name: AI_CODEX_MODEL
              valueFrom:
                configMapKeyRef:
                  name: green-house-config
                  key: AI_CODEX_MODEL
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

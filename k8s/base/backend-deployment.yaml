apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-house-backend
  namespace: green-house
  labels:
    app.kubernetes.io/name: green-house
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: green-house
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: green-house
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: sales-photos
          persistentVolumeClaim:
            claimName: green-house-sales-photos-host
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/styughjvbn/green-house-backend:sha-ec821db
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: sales-photos
              mountPath: /var/lib/greenhouse/slip-photos
          envFrom:
            - configMapRef:
                name: green-house-config
            - secretRef:
                name: green-house-secret
          env:
            - name: AI_RUNTIME_SECRET
              valueFrom:
                secretKeyRef:
                  name: green-house-ai-secret
                  key: AI_RUNTIME_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

apiVersion: v1
kind: PersistentVolume
metadata:
  name: green-house-sales-photos-host
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: green-house
    name: green-house-sales-photos-host
  hostPath:
    path: /opt/green-house/data/slip-photos
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              # Confirm this production node label before first apply.
              values: [mini-pc]

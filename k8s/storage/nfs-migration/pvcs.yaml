apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: green-house-sales-photos-nfs
  namespace: green-house
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

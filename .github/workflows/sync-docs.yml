name: Sync docs to Google Drive

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"

  # GitHub Actions 화면에서 필요할 때 직접 실행
  workflow_dispatch:

concurrency:
  group: google-drive-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Verify Google Drive connection
        run: |
          rclone lsd gdrive:

      - name: Sync docs
        run: |
          rclone sync ./docs gdrive: \
            --delete-after \
            --verbose
name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check
      - name: Check generated API types
        id: api-types
        continue-on-error: true
        run: npm run api:types:check
      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build frontend
        id: build
        continue-on-error: true
        run: npm run build
      - name: Write frontend summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Frontend

          | Check | Result |
          | --- | --- |
          | Format | `${{ steps.format.outcome }}` |
          | Generated API types | `${{ steps.api-types.outcome }}` |
          | Tests | `${{ steps.test.outcome }}` |
          | Lint | `${{ steps.lint.outcome }}` |
          | Build | `${{ steps.build.outcome }}` |
          EOF
      - name: Fail when a frontend check failed
        if: always()
        run: |
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.api-types.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.build.outcome }}" = success

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Run backend checks
        id: check
        continue-on-error: true
        run: ./gradlew check --no-daemon
      - name: Build backend jar
        id: boot-jar
        continue-on-error: true
        run: ./gradlew bootJar --no-daemon
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests
            backend/build/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Write backend summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Backend

          | Check | Result |
          | --- | --- |
          | Gradle check | `${{ steps.check.outcome }}` |
          | bootJar | `${{ steps.boot-jar.outcome }}` |
          EOF
      - name: Fail when a backend check failed
        if: always()
        run: |
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.boot-jar.outcome }}" = success

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Require Docker for PostgreSQL tests
        id: docker
        continue-on-error: true
        run: docker info
      - name: Run PostgreSQL E2E tests
        id: e2e
        if: steps.docker.outcome == 'success'
        continue-on-error: true
        run: ./gradlew workE2eTest --no-daemon
      - name: Run PostgreSQL benchmark
        id: benchmark
        if: steps.docker.outcome == 'success'
        continue-on-error: true
        run: ./gradlew workBenchmark -PworkBenchmarkEnforce=true --no-daemon
      - name: Upload PostgreSQL test and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-reports
          path: |
            backend/build/reports/tests
            backend/build/test-results
            backend/build/work-benchmark
          if-no-files-found: ignore
          retention-days: 14
      - name: Write PostgreSQL summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Backend PostgreSQL

          | Check | Result |
          | --- | --- |
          | Docker | `${{ steps.docker.outcome }}` |
          | E2E tests | `${{ steps.e2e.outcome }}` |
          | Benchmark and query limits | `${{ steps.benchmark.outcome }}` |
          EOF
      - name: Fail when a PostgreSQL check failed
        if: always()
        run: |
          test "${{ steps.docker.outcome }}" = success
          test "${{ steps.e2e.outcome }}" = success
          test "${{ steps.benchmark.outcome }}" = success

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install PyYAML==6.0.2
      - run: npm ci
        working-directory: frontend
      - name: Generate OpenAPI
        id: openapi
        continue-on-error: true
        run: python3 scripts/generate_openapi.py
      - name: Generate frontend API types
        id: api-types
        continue-on-error: true
        run: npm run api:types
        working-directory: frontend
      - name: Check generated contract drift
        id: drift
        continue-on-error: true
        run: git diff --exit-code -- docs/api frontend/src/shared/api/generated/openapi.d.ts
      - name: Write API contract summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## API contract

          | Check | Result |
          | --- | --- |
          | OpenAPI generation | `${{ steps.openapi.outcome }}` |
          | Frontend type generation | `${{ steps.api-types.outcome }}` |
          | Contract drift | `${{ steps.drift.outcome }}` |
          EOF
      - name: Fail when an API contract check failed
        if: always()
        run: |
          test "${{ steps.openapi.outcome }}" = success
          test "${{ steps.api-types.outcome }}" = success
          test "${{ steps.drift.outcome }}" = success
